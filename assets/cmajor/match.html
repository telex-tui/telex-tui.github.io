<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matching Harmonics</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --code: #1c2128; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --dot: #f2cc60; --harm: #3fb950; --warn: #f0883e; --bad: #f85149;
  }
  html, body { margin: 0; background: transparent; color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; }
  .wrap { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { font-family: inherit; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 10px 0 0; }
  .row > span { font-size: 12px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button, .seg button, .play { background: transparent; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
  .chips button { border: 1px solid var(--border); border-radius: 999px; padding: 3px 11px; }
  .chips button[aria-pressed="true"] { border-color: var(--accent); color: var(--text); background: var(--code); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; padding: 5px 11px; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--code); color: var(--text); }
  .play { border: 1px solid var(--harm); color: var(--text); border-radius: 6px; padding: 5px 12px; }
  .readout { background: var(--code); border-radius: 6px; padding: 8px 10px; font-size: 13.5px; min-height: 6.2em; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .readout p { margin: 0; }
  .readout p + p { margin-top: 4px; color: var(--muted); }
  .readout p b { color: var(--text); }
  .rule { font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 12px; }
  .rule b { color: var(--text); font-weight: 600; }
  .rule .bad { color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <svg id="v" aria-label="The harmonics of middle C and of a second note on a frequency axis, the pair that nearly match, zoomed in, and how loud that pair is over two seconds"></svg>
  <div class="row"><span>Second note</span><div class="chips" id="notes"></div></div>
  <div class="row">
    <span>Tuning</span>
    <div class="seg" role="group" aria-label="Tuning of the second note">
      <button data-t="exact" aria-pressed="true">Exact ratio</button>
      <button data-t="piano" aria-pressed="false">Piano</button>
      <button data-t="off" aria-pressed="false">Slightly off</button>
    </div>
  </div>
  <div class="row">
    <button class="play" id="both">&#9654; Both notes</button>
    <button class="play" id="pair">&#9654; Just the matching pair</button>
  </div>
  <div class="readout" id="out" aria-live="polite"></div>
  <p class="rule" id="rule"></p>
</div>

<script>
(() => {
  // ---- The rules ----
  const C4 = 261.6256;                       // middle C, in Hz
  // second notes: name, keys above C, exact ratio as [p, q], and where that ratio sits on middle C's frequency ring
  const CHOICES = [
    ['E', 4, [5, 4], 'the quarter turn', '×1¼'], ['F', 5, [4, 3], 'a third of a turn', '×1⅓'],
    ['G', 7, [3, 2], 'the half turn', '×1½'], ['A', 9, [5, 3], 'two thirds of a turn', '×1⅔'], ['C5', 12, [2, 1], 'the top', '×2']
  ];
  const OFF = 0.994;                         // "slightly off": 0.6% below the exact ratio
  const FMAX = 2200, NC = 8;                 // the top axis runs from 0 to 2,200 Hz; C's first 8 harmonics
  let pick = 2, tune = 'exact';

  const ratioOf = (i = pick, t = tune) => {
    const [, keys, [p, q]] = CHOICES[i];
    return t === 'exact' ? p / q : t === 'piano' ? 2 ** (keys / 12) : (p / q) * OFF;
  };
  // The matching pair: with an exact ratio p:q, C's harmonic p and the second note's harmonic q are the same frequency.
  const pairOf = (i = pick, t = tune) => {
    const [p, q] = CHOICES[i][2], fc = p * C4, fx = q * C4 * ratioOf(i, t);
    return { p, q, fc, fx, gap: Math.abs(fc - fx) };
  };
  const swell = (gap, t) => Math.abs(Math.cos(Math.PI * gap * t));   // the size of two equal waves, gap Hz apart, added together

  // The code checks its own rules: every exact pair matches to the hertz, and the swell strip fades to nothing
  // once for every hertz of gap (counted over 2 seconds for slightly-off G).
  function check() {
    for (let i = 0; i < CHOICES.length; i++) if (pairOf(i, 'exact').gap > 1e-9) return false;
    const g = pairOf(2, 'off').gap;
    let lows = 0, prev = swell(g, 0), falling = false;
    for (let k = 1; k <= 20000; k++) {
      const v = swell(g, 2 * k / 20000);
      if (v < prev) falling = true; else if (falling && prev < 0.01) { lows++; falling = false; } else if (v > prev) falling = false;
      prev = v;
    }
    return lows === Math.floor(2 * g + 0.5);
  }
  const ruleOK = check();

  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const a in attrs) e.setAttribute(a, attrs[a]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const cv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const COL = { text: cv('--text'), muted: cv('--muted'), border: cv('--border'), dot: cv('--dot'), accent: cv('--accent'),
    harm: cv('--harm'), warn: cv('--warn'), card: cv('--card') };
  const hz = v => v >= 1000 ? v.toLocaleString('en', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : v.toFixed(1);
  const deg = v => { const r = Math.round(v); return Math.abs(v - r) < 0.05 ? String(r) : v.toFixed(1); };

  // ---- Sound ----
  let ac;
  function play(parts) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const t0 = ac.currentTime + 0.02, dur = 4, out = ac.createGain();
      out.gain.setValueAtTime(0, t0); out.gain.linearRampToValueAtTime(0.07, t0 + 0.05);
      out.gain.setValueAtTime(0.07, t0 + dur - 0.6); out.gain.linearRampToValueAtTime(0, t0 + dur);
      out.connect(ac.destination);
      for (const [f, a] of parts) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = f; g.gain.value = a; o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + dur + 0.1);
      }
    } catch (e) {}
  }
  const note = f => Array.from({ length: 8 }, (_, i) => [f * (i + 1), 1 / (i + 1)]);

  function draw() {
    const w = Math.max(280, Math.round($('v').getBoundingClientRect().width || 600));
    const svg = $('v'); svg.replaceChildren();
    const H = 326;
    svg.setAttribute('viewBox', `0 0 ${w} ${H}`); svg.setAttribute('height', H);
    const name = CHOICES[pick][0], X = C4 * ratioOf(), pr = pairOf();
    const exact = pr.gap < 1e-9;

    // Panel 1: both notes' harmonics on a frequency axis, every hertz the same width.
    const xa = 14, xb = w - 14, Xf = f => xa + (xb - xa) * f / FMAX, ya = 72;
    el('text', { x: xa, y: 12, 'font-size': 11, fill: COL.muted }, svg, 'Harmonics, every hertz the same width');
    const leg = el('text', { x: xa, y: 27, 'font-size': 11 }, svg);
    el('tspan', { fill: COL.dot }, leg, 'C’s above the line');
    el('tspan', { fill: COL.muted }, leg, ', ');
    el('tspan', { fill: COL.accent }, leg, name + '’s below');
    el('line', { x1: xa, x2: xb, y1: ya, y2: ya, stroke: COL.muted, 'stroke-width': 1 }, svg);
    for (const f of [0, 500, 1000, 1500, 2000]) {
      el('line', { x1: Xf(f), x2: Xf(f), y1: ya - 3, y2: ya + 3, stroke: COL.muted }, svg);
      el('text', { x: Xf(f), y: ya + 48, 'text-anchor': f ? 'middle' : 'start', 'font-size': 10, fill: COL.muted }, svg, f ? f.toLocaleString('en') + ' Hz' : '0 Hz');
    }
    // matching pairs: C's harmonic p·m and the second note's harmonic q·m
    for (let m = 1; pr.p * m <= NC && pr.q * m * X <= FMAX + 0.5; m++) {
      const xm = (Xf(pr.p * m * C4) + Xf(pr.q * m * X)) / 2;
      el('rect', { x: xm - 6, y: ya - 21, width: 12, height: 42, rx: 3, fill: exact ? COL.harm : COL.warn, 'fill-opacity': m === 1 ? 0.3 : 0.15 }, svg);
    }
    for (let n = 1; n <= NC; n++) {
      const xx = Xf(n * C4);
      el('line', { x1: xx, x2: xx, y1: ya - 18, y2: ya, stroke: COL.dot, 'stroke-width': 2 }, svg);
      el('text', { x: xx, y: ya - 24, 'text-anchor': 'middle', 'font-size': 10.5, fill: COL.dot, 'font-weight': n === pr.p ? 700 : 400 }, svg, n);
    }
    for (let n = 1; n * X <= FMAX + 0.5; n++) {
      const xx = Xf(n * X);
      el('line', { x1: xx, x2: xx, y1: ya, y2: ya + 18, stroke: COL.accent, 'stroke-width': 2 }, svg);
      el('text', { x: xx, y: ya + 33, 'text-anchor': 'middle', 'font-size': 10.5, fill: COL.accent, 'font-weight': n === pr.q ? 700 : 400 }, svg, n);
    }

    // Panel 2: the matching pair, zoomed in to 15 Hz either side of C's harmonic, one tick per hertz.
    const yz = 182, lo = pr.fc - 15, za = xa + 50, zb = xb - 50, Z = f => za + (zb - za) * (f - lo) / 30;
    el('text', { x: xa, y: 142, 'font-size': 11, fill: COL.muted }, svg, 'Zoomed in on the matching pair, one tick per hertz');
    el('line', { x1: za, x2: zb, y1: yz, y2: yz, stroke: COL.muted }, svg);
    for (let f = Math.ceil(lo); f <= lo + 30; f++) {
      const big = f % 5 === 0;
      el('line', { x1: Z(f), x2: Z(f), y1: yz - (big ? 4 : 2), y2: yz + (big ? 4 : 2), stroke: COL.muted, 'stroke-opacity': big ? 1 : 0.6 }, svg);
    }
    el('text', { x: za - 5, y: yz + 4, 'text-anchor': 'end', 'font-size': 10, fill: COL.muted }, svg, hz(lo));
    el('text', { x: zb + 5, y: yz + 4, 'font-size': 10, fill: COL.muted }, svg, hz(lo + 30) + ' Hz');
    el('line', { x1: Z(pr.fc), x2: Z(pr.fc), y1: yz - 18, y2: yz, stroke: COL.dot, 'stroke-width': 3 }, svg);
    el('line', { x1: Z(pr.fx), x2: Z(pr.fx), y1: yz, y2: yz + 18, stroke: COL.accent, 'stroke-width': 3 }, svg);
    const clampX = v => Math.min(Math.max(v, xa + 62), xb - 62);
    el('text', { x: clampX(Z(pr.fc)), y: yz - 24, 'text-anchor': 'middle', 'font-size': 10.5, fill: COL.dot }, svg, `C × ${pr.p}: ${hz(pr.fc)} Hz`);
    el('text', { x: clampX(Z(pr.fx)), y: yz + 32, 'text-anchor': 'middle', 'font-size': 10.5, fill: COL.accent }, svg, `${name} × ${pr.q}: ${hz(pr.fx)} Hz`);

    // Panel 3: the matching pair added together, over 2 seconds.
    const yt = 240, ys = 278, amp = 20;
    el('text', { x: xa, y: yt, 'font-size': 11, fill: COL.muted }, svg, 'The pair added together, over 2 seconds');
    const pts = [], M = 1200;
    for (let k = 0; k <= M; k++) { const t = 2 * k / M; pts.push([xa + (xb - xa) * k / M, amp * swell(pr.gap, t)]); }
    const d = 'M' + pts.map(([px, a]) => `${px.toFixed(1)} ${(ys - a).toFixed(1)}`).join(' L') + ' L' + pts.slice().reverse().map(([px, a]) => `${px.toFixed(1)} ${(ys + a).toFixed(1)}`).join(' L') + ' Z';
    el('path', { d, fill: exact ? COL.harm : COL.warn, 'fill-opacity': 0.55, stroke: 'none' }, svg);
    for (const t of [0, 0.5, 1, 1.5, 2]) {
      const px = xa + (xb - xa) * t / 2;
      el('line', { x1: px, x2: px, y1: ys + amp + 3, y2: ys + amp + 7, stroke: COL.muted }, svg);
      el('text', { x: px, y: ys + amp + 19, 'text-anchor': t === 0 ? 'start' : t === 2 ? 'end' : 'middle', 'font-size': 10, fill: COL.muted }, svg, t + ' s');
    }
  }

  function update() {
    draw();
    const [name, keys, [p, q], spot, mark] = CHOICES[pick], pr = pairOf(), X = C4 * ratioOf();
    const exact = pr.gap < 1e-9;
    let l1, l2;
    if (exact) l1 = `C’s harmonic ${p} and ${name}’s harmonic ${q} are both <b>${hz(pr.fc)} Hz</b>. They stay lined up, peak for peak, so together they hold steady.`;
    else l1 = `C’s harmonic ${p} is ${hz(pr.fc)} Hz and ${name}’s harmonic ${q} is ${hz(pr.fx)} Hz: <b>${pr.gap.toFixed(2)} Hz apart</b>. They line up and drift apart again ${pr.gap.toFixed(2)} times a second, swelling when their peaks line up and fading when they don’t. That’s the waver.`;
    const dHz = X - C4 * p / q, dDeg = dHz / C4 * 360;
    if (Math.abs(dHz) < 1e-9) l2 = name === 'C5' ? 'On the frequency ring, C5 sits exactly at the top, like every C.' : `On the frequency ring, ${name} sits exactly on ${spot}, ${mark}.`;
    else {
      l2 = `On the frequency ring, ${name} sits ${deg(Math.abs(dDeg))}° ${dDeg > 0 ? 'past' : 'short of'} ${spot}. A degree of middle C’s ring is 0.73 Hz, so ${name} is ${Math.abs(dHz).toFixed(2)} Hz ${dHz > 0 ? 'above' : 'below'} ${mark}.`;
      if (q > 1) l2 += ` Its harmonic ${q} is ${{ 2: 'twice', 3: 'three times', 4: 'four times' }[q]} as far off: ${pr.gap.toFixed(2)} Hz.`;
    }
    $('out').innerHTML = `<p>${l1}</p><p>${l2}</p>`;
    $('rule').innerHTML = (ruleOK ? '' : '<span class="bad">Rule check failed. </span>') +
      `<b>Rule:</b> harmonic n of a note vibrates n times as fast as the note. ${name} is ` +
      (tune === 'exact' ? `exactly ${q === 1 ? p : p + '/' + q} × middle C` : tune === 'piano' ? `the piano’s, ${keys} keys above middle C, each ×1.0595` : `0.6% below ${q === 1 ? p : p + '/' + q} × middle C`) +
      `: ${hz(X)} Hz. The bottom strip draws the matching pair added together: its size at time t is |cos(π × ${pr.gap.toFixed(2)} × t)|, so it fades to nothing once for every hertz of gap.`;
    [...$('notes').children].forEach((btn, i) => btn.setAttribute('aria-pressed', String(i === pick)));
    document.querySelectorAll('.seg button').forEach(btn => btn.setAttribute('aria-pressed', String(btn.dataset.t === tune)));
    try { parent.postMessage({ cmajorEmbed: 'match', height: Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height) + 2 }, '*'); } catch (e) {}
  }

  CHOICES.forEach((c, i) => {
    const btn = document.createElement('button'); btn.textContent = c[0];
    btn.addEventListener('click', () => { pick = i; update(); });
    $('notes').appendChild(btn);
  });
  document.querySelectorAll('.seg button').forEach(btn => btn.addEventListener('click', () => { tune = btn.dataset.t; update(); }));
  $('both').addEventListener('click', () => play([...note(C4), ...note(C4 * ratioOf())]));
  $('pair').addEventListener('click', () => { const pr = pairOf(); play([[pr.fc, 1.2], [pr.fx, 1.2]]); });
  new ResizeObserver(() => update()).observe(document.querySelector('.wrap'));
  update();
})();
</script>
</body>
</html>
