<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="s2-title s2-desc">
  <title id="s2-title">A &amp;dyn Widget handle: two 8-byte words</title>
  <desc id="s2-desc">The handle w is 16 bytes. Word 1, the data pointer, holds the address of bar, an 8-byte ProgressBar on the stack. Word 2, the vtable pointer, holds the address of the vtable for ProgressBar as Widget, in read-only data. The vtable holds a null drop slot, size 8, align 4, and the address of render, which points into the code at ProgressBar's render function.</desc>
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      .sans, .sans text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
    <pattern id="s2hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#161b22"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#30363d" stroke-width="2"/>
    </pattern>
    <marker id="s2arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/>
    </marker>
    <marker id="s2arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="#0d1117"/>
  <rect x="10" y="10" width="780" height="400" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="30" y="42" font-size="15" fill="#e6edf3">let w: &amp;dyn Widget = &amp;bar;</text>
  <text class="sans" x="30" y="64" font-size="13" fill="#8b949e">A handle is two 8-byte words. Neither word is the value: both are addresses.</text>

  <!-- the handle -->
  <text x="48" y="137" font-size="13" fill="#8b949e" text-anchor="end">w</text>
  <g class="sans" font-size="12" text-anchor="middle">
    <text x="130" y="104" fill="#bc8cff">word 1 · data pointer</text>
    <text x="270" y="104" fill="#d29922">word 2 · vtable pointer</text>
  </g>
  <rect x="60" y="112" width="140" height="44" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <rect x="200" y="112" width="140" height="44" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
  <g font-size="12" fill="#e6edf3" text-anchor="middle"><text x="130" y="139">address of bar</text><text x="270" y="139">address of vtable</text></g>
  <g font-size="11" fill="#8b949e" text-anchor="middle"><text x="60" y="172">0</text><text x="200" y="172">8</text><text x="340" y="172">16</text></g>

  <!-- word 1 → the value -->
  <line x1="100" y1="156" x2="100" y2="242" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#s2arrowP)"/>
  <text class="sans" x="60" y="236" font-size="12" fill="#8b949e" text-anchor="start" dx="50">bar: ProgressBar, on the stack</text>
  <g fill="#1c2128" stroke="#58a6ff" stroke-width="1.5">
    <rect x="60" y="250" width="136" height="40"/><rect x="196" y="250" width="34" height="40"/>
  </g>
  <line x1="94" y1="251" x2="94" y2="289" stroke="#30363d"/><line x1="128" y1="251" x2="128" y2="289" stroke="#30363d"/><line x1="162" y1="251" x2="162" y2="289" stroke="#30363d"/>
  <rect x="230" y="250" width="102" height="40" fill="url(#s2hatch)" stroke="#30363d"/>
  <g font-size="12" fill="#e6edf3" text-anchor="middle">
    <text x="77" y="275">0a</text><text x="111" y="275">00</text><text x="145" y="275">00</text><text x="179" y="275">00</text><text x="213" y="275">07</text>
  </g>
  <g class="sans" font-size="11.5" text-anchor="middle">
    <text x="128" y="306" fill="#58a6ff">max</text><text x="213" y="306" fill="#58a6ff">value</text><text x="281" y="306" fill="#8b949e">padding</text>
  </g>

  <!-- word 2 → the vtable -->
  <line x1="340" y1="134" x2="434" y2="134" stroke="#d29922" stroke-width="1.5" marker-end="url(#s2arrowO)"/>
  <text x="440" y="100" font-size="12.5" fill="#d29922">vtable: ProgressBar as Widget<tspan class="sans" dx="8" font-size="11.5" fill="#8b949e">read-only data</tspan></text>
  <rect x="440" y="110" width="320" height="88" rx="4" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
  <g stroke="#30363d"><line x1="440" y1="132" x2="760" y2="132"/><line x1="440" y1="154" x2="760" y2="154"/><line x1="440" y1="176" x2="760" y2="176"/><line x1="510" y1="110" x2="510" y2="198"/></g>
  <g font-size="12" fill="#8b949e"><text x="450" y="125">drop</text><text x="450" y="147">size</text><text x="450" y="169">align</text><text x="450" y="191">render</text></g>
  <g font-size="12" fill="#e6edf3"><text x="520" y="125">null: nothing to drop</text><text x="520" y="147">8</text><text x="520" y="169">4</text><text x="520" y="191">address</text></g>

  <!-- render's slot → code -->
  <text class="sans" x="440" y="242" font-size="12" fill="#3fb950">code</text>
  <rect x="440" y="250" width="320" height="40" rx="4" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="452" y="275" font-size="12.5" fill="#e6edf3">fn &lt;ProgressBar as Widget&gt;::render</text>
  <path d="M760 187 H778 V270 H764" fill="none" stroke="#d29922" stroke-width="1.5" marker-end="url(#s2arrowO)"/>

  <text class="sans" x="30" y="348" font-size="12.5" fill="#8b949e">Word 1 says where the value is: the stack here, the heap for a <tspan font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#e6edf3">Box</tspan>. Word 2 says how to handle it: its size,</text>
  <text class="sans" x="30" y="367" font-size="12.5" fill="#8b949e">its alignment, how to drop it, and where each trait method's code is. Both are 8 bytes, whatever the value's size.</text>
  <text class="sans" x="30" y="386" font-size="12.5" fill="#8b949e">A type with nothing to clean up, like this one, gets a null drop slot.</text>
</svg>
