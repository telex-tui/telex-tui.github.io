<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" role="img" aria-labelledby="s1-title s1-desc">
  <title id="s1-title">Array indexing: element i starts at base + i × size</title>
  <desc id="s1-desc">Top: an array of three 8-byte ProgressBars, elements at offsets 0, 8 and 16, so bars[i] = base + i × 8. Middle: an array of three 32-byte Labels, each with text at 0, col at 16 and row at 24, elements at offsets 0, 32 and 64, so labels[i] = base + i × 32. Bottom: what a mixed array of Label, ProgressBar, Label would need. Its element 2 starts at 40, but 2 × 8 = 16 lands inside element 0 and 2 × 32 = 64 lands inside element 2. No single multiplier works.</desc>
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      .sans, .sans text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
    <marker id="s1arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
    <marker id="s1arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6edf3"/>
    </marker>
  </defs>

  <rect width="800" height="570" fill="#0d1117"/>
  <rect x="10" y="10" width="780" height="550" rx="8" fill="#161b22" stroke="#30363d"/>
  <text class="sans" x="30" y="42" font-size="15" fill="#e6edf3">An array is one size, repeated</text>
  <text class="sans" x="30" y="64" font-size="13" fill="#8b949e">Element i starts at base + i × size. The size is a constant, compiled into the code. 7 px = 1 byte.</text>

  <!-- ===== bars: [ProgressBar; 3] ===== -->
  <text x="64" y="102" font-size="13" fill="#e6edf3">bars: [ProgressBar; 3]<tspan class="sans" dx="10" font-size="12" fill="#8b949e">8 bytes each</tspan></text>
  <g font-size="11" fill="#8b949e" text-anchor="middle"><text x="92" y="122">[0]</text><text x="148" y="122">[1]</text><text x="204" y="122">[2]</text></g>
  <g fill="#1c2128" stroke="#58a6ff" stroke-width="1.5">
    <rect x="64" y="128" width="56" height="36"/><rect x="120" y="128" width="56" height="36"/><rect x="176" y="128" width="56" height="36"/>
  </g>
  <g class="sans" font-size="10.5" fill="#e6edf3" text-anchor="middle"><text x="92" y="150">8 bytes</text><text x="148" y="150">8 bytes</text><text x="204" y="150">8 bytes</text></g>
  <g font-size="11" fill="#8b949e" text-anchor="middle"><text x="64" y="180">0</text><text x="120" y="180">8</text><text x="176" y="180">16</text><text x="232" y="180">24</text></g>
  <text x="290" y="151" font-size="13.5" fill="#e6edf3">bars[i] = base + i × 8</text>

  <!-- ===== labels: [Label; 3] ===== -->
  <text x="64" y="226" font-size="13" fill="#e6edf3">labels: [Label; 3]<tspan class="sans" dx="10" font-size="12" fill="#8b949e">32 bytes each</tspan></text>
  <g font-size="11" fill="#8b949e" text-anchor="middle"><text x="176" y="246">[0]</text><text x="400" y="246">[1]</text><text x="624" y="246">[2]</text></g>
  <g fill="#1c2128" stroke="#58a6ff" stroke-width="1.5">
    <rect x="64" y="252" width="224" height="36"/><rect x="288" y="252" width="224" height="36"/><rect x="512" y="252" width="224" height="36"/>
  </g>
  <g stroke="#30363d">
    <line x1="176" y1="253" x2="176" y2="287"/><line x1="232" y1="253" x2="232" y2="287"/>
    <line x1="400" y1="253" x2="400" y2="287"/><line x1="456" y1="253" x2="456" y2="287"/>
    <line x1="624" y1="253" x2="624" y2="287"/><line x1="680" y1="253" x2="680" y2="287"/>
  </g>
  <g class="sans" font-size="10.5" fill="#8b949e" text-anchor="middle">
    <text x="120" y="274">text</text><text x="204" y="274">col</text><text x="260" y="274">row</text>
    <text x="344" y="274">text</text><text x="428" y="274">col</text><text x="484" y="274">row</text>
    <text x="568" y="274">text</text><text x="652" y="274">col</text><text x="708" y="274">row</text>
  </g>
  <g font-size="11" fill="#8b949e" text-anchor="middle"><text x="64" y="304">0</text><text x="288" y="304">32</text><text x="512" y="304">64</text><text x="736" y="304">96</text></g>
  <text x="64" y="334" font-size="13.5" fill="#e6edf3">labels[i] = base + i × 32</text>

  <!-- ===== a mixed array ===== -->
  <text x="64" y="384" font-size="13" fill="#e6edf3">[Label, ProgressBar, Label]<tspan class="sans" dx="10" font-size="12" fill="#8b949e">what a mixed array would need</tspan></text>
  <g font-size="11" fill="#8b949e" text-anchor="middle"><text x="176" y="404">[0]</text><text x="316" y="404">[1]</text><text x="456" y="404">[2]</text></g>
  <g fill="#1c2128" stroke="#58a6ff" stroke-width="1.5">
    <rect x="64" y="410" width="224" height="36"/><rect x="288" y="410" width="56" height="36"/><rect x="344" y="410" width="224" height="36"/>
  </g>
  <g class="sans" font-size="10.5" fill="#e6edf3" text-anchor="middle"><text x="176" y="432">32 bytes</text><text x="316" y="432">8 bytes</text><text x="456" y="432">32 bytes</text></g>
  <g font-size="11" fill="#8b949e" text-anchor="middle"><text x="64" y="462">0</text><text x="288" y="462">32</text><text x="568" y="462">72</text></g>
  <text x="344" y="462" font-size="11.5" font-weight="bold" fill="#e6edf3" text-anchor="middle">40</text>

  <!-- where i × size would put element 2 -->
  <line x1="176" y1="494" x2="176" y2="450" stroke="#f85149" stroke-width="1.5" marker-end="url(#s1arrowR)"/>
  <line x1="512" y1="494" x2="512" y2="450" stroke="#f85149" stroke-width="1.5" marker-end="url(#s1arrowR)"/>
  <line x1="344" y1="494" x2="344" y2="470" stroke="#e6edf3" stroke-width="1.5" marker-end="url(#s1arrowW)"/>
  <g font-size="11.5" text-anchor="middle">
    <text x="176" y="510" fill="#f85149">2 × 8 = 16: inside [0]</text>
    <text x="512" y="510" fill="#f85149">2 × 32 = 64: inside [2]</text>
    <text x="344" y="510" fill="#e6edf3">[2] starts at 40</text>
  </g>
  <text class="sans" x="30" y="542" font-size="12.5" fill="#8b949e">No single multiplier finds element 2, so there is no stride to compile. rustc rejects the mixed array: E0308.</text>
</svg>
