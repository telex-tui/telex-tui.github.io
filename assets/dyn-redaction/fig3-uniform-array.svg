<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" width="800" height="590" role="img" aria-labelledby="s3-title s3-desc">
  <title id="s3-title">A Vec of Box&lt;dyn Widget&gt;: one 16-byte stride, values of any size</title>
  <desc id="s3-desc">The Vec's buffer holds three 16-byte handles at offsets 0, 16 and 32, so screen[i] = base + i × 16. Each handle's data word points at its value on the heap: a 32-byte Label "CPU", a 32-byte Label "MEM", and an 8-byte ProgressBar, each placed wherever it was allocated. Each handle's vtable word points up at a vtable in read-only data: both Label handles at the Label vtable (size 32, align 8), the ProgressBar handle at the ProgressBar vtable (size 8, align 4).</desc>
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      .sans, .sans text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
    <pattern id="s3hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#161b22"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#30363d" stroke-width="2"/>
    </pattern>
    <marker id="s3arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/>
    </marker>
    <marker id="s3arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
  </defs>

  <rect width="800" height="590" fill="#0d1117"/>
  <rect x="10" y="10" width="780" height="570" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="30" y="42" font-size="15" fill="#e6edf3">let screen: Vec&lt;Box&lt;dyn Widget&gt;&gt; = vec![…];</text>
  <text class="sans" x="30" y="64" font-size="13" fill="#8b949e">screen[i] = base + i × 16, whatever each handle points at. Values drawn at 7 px = 1 byte.</text>

  <!-- vtables, in read-only data -->
  <text x="60" y="102" font-size="12.5" fill="#d29922">vtable: Label as Widget</text>
  <rect x="60" y="110" width="240" height="88" rx="4" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
  <text x="320" y="102" font-size="12.5" fill="#d29922">vtable: ProgressBar as Widget</text>
  <rect x="320" y="110" width="240" height="88" rx="4" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
  <g stroke="#30363d">
    <line x1="60" y1="132" x2="300" y2="132"/><line x1="60" y1="154" x2="300" y2="154"/><line x1="60" y1="176" x2="300" y2="176"/><line x1="124" y1="110" x2="124" y2="198"/>
    <line x1="320" y1="132" x2="560" y2="132"/><line x1="320" y1="154" x2="560" y2="154"/><line x1="320" y1="176" x2="560" y2="176"/><line x1="384" y1="110" x2="384" y2="198"/>
  </g>
  <g font-size="11.5" fill="#8b949e">
    <text x="70" y="125">drop</text><text x="70" y="147">size</text><text x="70" y="169">align</text><text x="70" y="191">render</text>
    <text x="330" y="125">drop</text><text x="330" y="147">size</text><text x="330" y="169">align</text><text x="330" y="191">render</text>
  </g>
  <g font-size="11.5" fill="#e6edf3">
    <text x="134" y="125">null</text><text x="134" y="147">32</text><text x="134" y="169">8</text><text x="134" y="191">address</text>
    <text x="394" y="125">null</text><text x="394" y="147">8</text><text x="394" y="169">4</text><text x="394" y="191">address</text>
  </g>
  <g class="sans" font-size="12" fill="#8b949e">
    <text x="580" y="128">read-only data:</text>
    <text x="580" y="146">a table for each type.</text>
    <text x="580" y="164">Both labels' handles point</text>
    <text x="580" y="182">at the same one.</text>
  </g>

  <!-- the buffer: three 16-byte handles -->
  <g font-size="11" fill="#8b949e"><text x="62" y="240">screen[0]</text><text x="174" y="240">screen[1]</text><text x="286" y="240">screen[2]</text></g>
  <g fill="#1c2128" stroke-width="1.5">
    <rect x="60" y="248" width="56" height="40" stroke="#bc8cff"/><rect x="116" y="248" width="56" height="40" stroke="#d29922"/>
    <rect x="172" y="248" width="56" height="40" stroke="#bc8cff"/><rect x="228" y="248" width="56" height="40" stroke="#d29922"/>
    <rect x="284" y="248" width="56" height="40" stroke="#bc8cff"/><rect x="340" y="248" width="56" height="40" stroke="#d29922"/>
  </g>
  <g font-size="11" fill="#e6edf3" text-anchor="middle">
    <text x="88" y="272">data</text><text x="144" y="272">vtable</text>
    <text x="200" y="272">data</text><text x="256" y="272">vtable</text>
    <text x="312" y="272">data</text><text x="368" y="272">vtable</text>
  </g>
  <g font-size="11" fill="#8b949e" text-anchor="middle"><text x="60" y="304">0</text><text x="172" y="304">16</text><text x="284" y="304">32</text><text x="396" y="304">48</text></g>
  <text x="430" y="266" font-size="13.5" fill="#e6edf3">screen[i] = base + i × 16</text>
  <text class="sans" x="430" y="286" font-size="12" fill="#8b949e">the Vec's buffer: 16 bytes per element</text>

  <!-- vtable words → vtables -->
  <g stroke="#d29922" stroke-width="1.5" fill="none">
    <line x1="144" y1="248" x2="144" y2="203" marker-end="url(#s3arrowO)"/>
    <line x1="256" y1="248" x2="256" y2="203" marker-end="url(#s3arrowO)"/>
    <line x1="368" y1="248" x2="368" y2="203" marker-end="url(#s3arrowO)"/>
  </g>

  <!-- data words → values on the heap -->
  <g stroke="#bc8cff" stroke-width="1.5" fill="none">
    <line x1="312" y1="288" x2="312" y2="345" marker-end="url(#s3arrowP)"/>
    <line x1="200" y1="288" x2="200" y2="407" marker-end="url(#s3arrowP)"/>
    <line x1="88" y1="288" x2="88" y2="469" marker-end="url(#s3arrowP)"/>
  </g>

  <!-- the ProgressBar: 8 bytes -->
  <rect x="290" y="350" width="28" height="36" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <rect x="318" y="350" width="7" height="36" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <rect x="325" y="350" width="21" height="36" fill="url(#s3hatch)" stroke="#30363d"/>
  <text x="358" y="373" font-size="12" fill="#e6edf3">ProgressBar<tspan class="sans" dx="8" font-size="12" fill="#8b949e">8 bytes</tspan></text>

  <!-- Label "MEM": 32 bytes -->
  <rect x="176" y="412" width="224" height="36" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="288" y1="413" x2="288" y2="447" stroke="#30363d"/><line x1="344" y1="413" x2="344" y2="447" stroke="#30363d"/>
  <g class="sans" font-size="10.5" fill="#8b949e" text-anchor="middle"><text x="232" y="434">text</text><text x="316" y="434">col</text><text x="372" y="434">row</text></g>
  <text x="410" y="435" font-size="12" fill="#e6edf3">Label "MEM"<tspan class="sans" dx="8" font-size="12" fill="#8b949e">32 bytes</tspan></text>

  <!-- Label "CPU": 32 bytes -->
  <rect x="60" y="474" width="224" height="36" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="172" y1="475" x2="172" y2="509" stroke="#30363d"/><line x1="228" y1="475" x2="228" y2="509" stroke="#30363d"/>
  <g class="sans" font-size="10.5" fill="#8b949e" text-anchor="middle"><text x="116" y="496">text</text><text x="200" y="496">col</text><text x="256" y="496">row</text></g>
  <text x="294" y="497" font-size="12" fill="#e6edf3">Label "CPU"<tspan class="sans" dx="8" font-size="12" fill="#8b949e">32 bytes</tspan></text>

  <g class="sans" font-size="12" fill="#8b949e">
    <text x="580" y="486">heap: each value wherever</text>
    <text x="580" y="504">it was allocated, at its own size</text>
  </g>

  <text class="sans" x="30" y="548" font-size="12.5" fill="#8b949e">Indexing never looks at the values: it steps through the buffer 16 bytes at a time. Each value's own size</text>
  <text class="sans" x="30" y="567" font-size="12.5" fill="#8b949e">is in its vtable, reached through word 2.</text>
</svg>
