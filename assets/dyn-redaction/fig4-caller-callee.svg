<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="s4-title s4-desc">
  <title id="s4-title">w.render(): what the caller knows and what the callee knows</title>
  <desc id="s4-desc">Left, the caller: the handle w, whose word 1 points at bar's 8 bytes and whose word 2 points at the vtable. The caller follows word 2 to the vtable, reads the render slot and calls that address with self set to word 1. To the caller the bytes have no field names. Right, the callee: ProgressBar's render, compiled when the type was known, reads max at self + 0 and value at self + 4.</desc>
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      .sans, .sans text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
    <pattern id="s4hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#161b22"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#30363d" stroke-width="2"/>
    </pattern>
    <marker id="s4arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/>
    </marker>
    <marker id="s4arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
    <marker id="s4arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="800" height="480" fill="#0d1117"/>
  <rect x="10" y="10" width="780" height="460" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="30" y="42" font-size="15" fill="#e6edf3">w.render()<tspan class="sans" dx="10" font-size="14" fill="#8b949e">who knows what</tspan></text>
  <text class="sans" x="30" y="64" font-size="13" fill="#8b949e">The caller holds a handle. The code it reaches was compiled for ProgressBar.</text>

  <!-- the handle -->
  <text x="48" y="154" font-size="13" fill="#8b949e" text-anchor="end">w</text>
  <rect x="60" y="110" width="140" height="40" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <rect x="60" y="150" width="140" height="40" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
  <g font-size="12" fill="#e6edf3" text-anchor="middle"><text x="130" y="135">address of bar</text><text x="130" y="175">address of vtable</text></g>

  <!-- word 1 → bar's bytes, which have no names for the caller -->
  <line x1="200" y1="130" x2="424" y2="130" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#s4arrowP)"/>
  <text class="sans" x="420" y="103" font-size="11.5" fill="#8b949e" text-anchor="end">to the caller, these have no names</text>
  <g fill="#000000" stroke="#484f58"><rect x="432" y="92" width="132" height="12" rx="2"/><rect x="568" y="92" width="30" height="12" rx="2"/></g>
  <g fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"><rect x="430" y="110" width="136" height="40"/><rect x="566" y="110" width="34" height="40"/></g>
  <line x1="464" y1="111" x2="464" y2="149" stroke="#30363d"/><line x1="498" y1="111" x2="498" y2="149" stroke="#30363d"/><line x1="532" y1="111" x2="532" y2="149" stroke="#30363d"/>
  <rect x="600" y="110" width="102" height="40" fill="url(#s4hatch)" stroke="#30363d"/>
  <g font-size="12" fill="#e6edf3" text-anchor="middle">
    <text x="447" y="135">0a</text><text x="481" y="135">00</text><text x="515" y="135">00</text><text x="549" y="135">00</text><text x="583" y="135">07</text>
  </g>
  <g font-size="11" fill="#8b949e" text-anchor="middle"><text x="430" y="166">0</text><text x="566" y="166">4</text><text x="702" y="166">8</text></g>

  <!-- the caller's three steps -->
  <g class="sans" font-size="12.5" fill="#e6edf3">
    <text x="60" y="222">1. word 2 → the vtable</text>
    <text x="60" y="244">2. its render slot → render's address</text>
    <text x="60" y="266">3. call it, with self = word 1</text>
  </g>
  <path d="M200 170 H330 V311 H305" fill="none" stroke="#d29922" stroke-width="1.5" marker-end="url(#s4arrowO)"/>

  <text x="60" y="292" font-size="12" fill="#d29922">vtable: ProgressBar as Widget</text>
  <rect x="60" y="300" width="240" height="88" rx="4" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
  <g stroke="#30363d"><line x1="60" y1="322" x2="300" y2="322"/><line x1="60" y1="344" x2="300" y2="344"/><line x1="60" y1="366" x2="300" y2="366"/><line x1="124" y1="300" x2="124" y2="388"/></g>
  <g font-size="11.5" fill="#8b949e"><text x="70" y="315">drop</text><text x="70" y="337">size</text><text x="70" y="359">align</text><text x="70" y="381">render</text></g>
  <g font-size="11.5" fill="#e6edf3"><text x="134" y="315">null</text><text x="134" y="337">8</text><text x="134" y="359">4</text><text x="134" y="381">address</text></g>

  <!-- the call -->
  <path d="M300 377 H400 V285 H425" fill="none" stroke="#d29922" stroke-width="1.5" marker-end="url(#s4arrowO)"/>
  <text class="sans" x="346" y="371" font-size="11" fill="#d29922">call</text>

  <!-- the callee -->
  <rect x="430" y="230" width="340" height="110" rx="4" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="442" y="252" font-size="11.5" fill="#8b949e">fn &lt;ProgressBar as Widget&gt;::render</text>
  <text x="442" y="280" font-size="12.5" fill="#e6edf3" style="white-space: pre">max   = 4 bytes at <tspan fill="#58a6ff">self + 0</tspan></text>
  <text x="442" y="304" font-size="12.5" fill="#e6edf3" style="white-space: pre">value = 1 byte  at <tspan fill="#58a6ff">self + 4</tspan></text>
  <text x="442" y="328" font-size="12.5" fill="#8b949e">build "[7/10]"</text>
  <g stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
    <line x1="447" y1="230" x2="447" y2="155" marker-end="url(#s4arrowB)"/>
    <line x1="583" y1="230" x2="583" y2="155" marker-end="url(#s4arrowB)"/>
  </g>
  <g font-size="11" fill="#58a6ff"><text x="455" y="202">self + 0</text><text x="591" y="202">self + 4</text></g>

  <g class="sans" font-size="12" fill="#8b949e">
    <text x="430" y="364">Compiled when ProgressBar was known: the offsets</text>
    <text x="430" y="382">are constants in its instructions. It needs only self.</text>
    <text x="60" y="414">The caller knows the handle, not the type: no field names,</text>
    <text x="60" y="432">no offsets, no fixed address for render.</text>
  </g>
  <text class="sans" x="30" y="458" font-size="12.5" fill="#8b949e">The vtable joins the two: written when the type was known, read by code that doesn't know it.</text>
</svg>
