<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 750" width="800" height="750" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">The same ProgressBar bytes behind a &amp;ProgressBar and behind a &amp;dyn Widget</title>
  <desc id="fig1-desc">Top: a plain reference r points at a ProgressBar in memory; the compiler knows its type, size, alignment, fields and offsets. Bottom: a two-word reference w points at the same unchanged bytes, but the type and field names are blacked out; its second word points to a vtable in read-only data holding size 8, align 4 and two addresses, which point into the program's code at ProgressBar's drop and render functions.</desc>
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      .sans, .sans text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#161b22"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#30363d" stroke-width="2"/>
    </pattern>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
  </defs>

  <rect width="800" height="750" fill="#0d1117"/>

  <!-- ===== Top: let r: &ProgressBar = &g; ===== -->
  <rect x="10" y="10" width="780" height="250" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="30" y="42" font-size="15" fill="#e6edf3">let r: &amp;ProgressBar = &amp;bar;</text>
  <text class="sans" x="30" y="64" font-size="13" fill="#8b949e">A plain reference: the compiler knows exactly what is behind it.</text>

  <text x="72" y="110" font-size="13" fill="#8b949e">r</text>
  <rect x="72" y="118" width="140" height="44" rx="4" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="142" y="145" font-size="13" fill="#e6edf3" text-anchor="middle">addr of bar</text>
  <text class="sans" x="142" y="180" font-size="12" fill="#8b949e" text-anchor="middle">8 bytes</text>
  <line x1="212" y1="140" x2="314" y2="140" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#arrowP)"/>

  <text x="320" y="92"><tspan font-size="14" font-weight="bold" fill="#e6edf3">ProgressBar</tspan><tspan class="sans" dx="10" font-size="12.5" fill="#8b949e">size 8 · align 4</tspan></text>
  <text x="424" y="112" font-size="12" fill="#58a6ff" text-anchor="middle">max: u32</text>
  <text x="554" y="112" font-size="12" fill="#58a6ff" text-anchor="middle">value: u8</text>
  <text class="sans" x="658" y="112" font-size="12" fill="#8b949e" text-anchor="middle">padding</text>

  <rect x="320" y="118" width="208" height="44" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="372" y1="119" x2="372" y2="161" stroke="#30363d"/>
  <line x1="424" y1="119" x2="424" y2="161" stroke="#30363d"/>
  <line x1="476" y1="119" x2="476" y2="161" stroke="#30363d"/>
  <rect x="528" y="118" width="52" height="44" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <rect x="580" y="118" width="156" height="44" fill="url(#hatch)" stroke="#30363d"/>
  <line x1="632" y1="118" x2="632" y2="162" stroke="#30363d"/>
  <line x1="684" y1="118" x2="684" y2="162" stroke="#30363d"/>
  <g font-size="13" fill="#e6edf3" text-anchor="middle">
    <text x="346" y="145">0a</text><text x="398" y="145">00</text><text x="450" y="145">00</text><text x="502" y="145">00</text>
    <text x="554" y="145">07</text>
  </g>
  <g font-size="11" fill="#8b949e" text-anchor="middle">
    <text x="320" y="180">0</text><text x="528" y="180">4</text><text x="580" y="180">5</text><text x="736" y="180">8</text>
  </g>

  <text class="sans" x="30" y="226" font-size="12.5" fill="#8b949e">Known at compile time: the type, its size and alignment, its fields and offsets, all its methods and trait impls.</text>

  <!-- ===== Bottom: let w: &dyn Widget = &g; ===== -->
  <rect x="10" y="280" width="780" height="455" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="30" y="312" font-size="15" fill="#e6edf3">let w: &amp;dyn Widget = &amp;bar;</text>
  <text class="sans" x="30" y="334" font-size="13" fill="#8b949e">The bytes don't move. What the compiler knew about them is blacked out; the vtable carries what's left.</text>

  <text x="72" y="380" font-size="13" fill="#8b949e">w</text>
  <text x="64" y="415" font-size="11" fill="#8b949e" text-anchor="end">data</text>
  <text x="64" y="459" font-size="11" fill="#8b949e" text-anchor="end">vtable</text>
  <rect x="72" y="388" width="140" height="44" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <rect x="72" y="432" width="140" height="44" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
  <text x="142" y="415" font-size="13" fill="#e6edf3" text-anchor="middle">addr of bar</text>
  <text x="142" y="459" font-size="13" fill="#e6edf3" text-anchor="middle">addr of vtable</text>
  <text class="sans" x="142" y="494" font-size="12" fill="#8b949e" text-anchor="middle">16 bytes</text>
  <line x1="212" y1="410" x2="314" y2="410" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <path d="M212 454 H262 V540 H314" fill="none" stroke="#d29922" stroke-width="1.5" marker-end="url(#arrowO)"/>

  <!-- redaction bars where the type and field names were -->
  <g fill="#000000" stroke="#484f58" stroke-width="1">
    <rect x="320" y="349" width="196" height="17" rx="2"/>
    <rect x="392" y="371" width="64" height="14" rx="2"/>
    <rect x="522" y="371" width="64" height="14" rx="2"/>
    <rect x="630" y="371" width="56" height="14" rx="2"/>
  </g>
  <g fill="#1c2128" stroke="#484f58">
    <rect x="320" y="388" width="52" height="44"/><rect x="372" y="388" width="52" height="44"/>
    <rect x="424" y="388" width="52" height="44"/><rect x="476" y="388" width="52" height="44"/>
    <rect x="528" y="388" width="52" height="44"/>
  </g>
  <rect x="580" y="388" width="156" height="44" fill="url(#hatch)" stroke="#484f58"/>
  <line x1="632" y1="388" x2="632" y2="432" stroke="#484f58"/>
  <line x1="684" y1="388" x2="684" y2="432" stroke="#484f58"/>
  <g font-size="13" fill="#e6edf3" text-anchor="middle">
    <text x="346" y="415">0a</text><text x="398" y="415">00</text><text x="450" y="415">00</text><text x="502" y="415">00</text>
    <text x="554" y="415">07</text>
  </g>

  <text x="320" y="500" font-size="13" fill="#d29922">vtable: ProgressBar as Widget<tspan class="sans" dx="8" font-size="12" fill="#8b949e">in read-only data</tspan></text>
  <rect x="320" y="508" width="416" height="88" rx="4" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
  <line x1="320" y1="530" x2="736" y2="530" stroke="#30363d"/>
  <line x1="320" y1="552" x2="736" y2="552" stroke="#30363d"/>
  <line x1="320" y1="574" x2="736" y2="574" stroke="#30363d"/>
  <line x1="408" y1="508" x2="408" y2="596" stroke="#30363d"/>
  <g font-size="12" fill="#8b949e">
    <text x="332" y="523">drop</text><text x="332" y="545">size</text><text x="332" y="567">align</text><text x="332" y="589">render</text>
  </g>
  <g font-size="12.5" fill="#e6edf3">
    <text x="420" y="523">address</text>
    <text x="420" y="545">8</text>
    <text x="420" y="567">4</text>
    <text x="420" y="589">address</text>
  </g>

  <!-- the program's code: where the vtable's addresses lead -->
  <text class="sans" x="320" y="628" font-size="12" fill="#3fb950">code: one copy of each function</text>
  <rect x="320" y="636" width="428" height="86" rx="4" fill="#1c2128" stroke="#3fb950" stroke-opacity="0.6"/>
  <rect x="332" y="646" width="404" height="30" rx="3" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="344" y="666" font-size="12.5" fill="#e6edf3">fn &lt;ProgressBar as Widget&gt;::render</text>
  <rect x="332" y="684" width="404" height="30" rx="3" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="344" y="704" font-size="12.5" fill="#e6edf3">fn drop_in_place::&lt;ProgressBar&gt;</text>
  <path d="M736 585 H766 V661 H740" fill="none" stroke="#d29922" stroke-width="1.5" marker-end="url(#arrowO)"/>
  <path d="M736 519 H778 V699 H740" fill="none" stroke="#d29922" stroke-width="1.5" marker-end="url(#arrowO)"/>

  <text class="sans" x="30" y="540" font-size="12.5" fill="#8b949e">Known at compile time:</text>
  <text class="sans" x="30" y="557" font-size="12.5" fill="#8b949e">only “implements Widget”.</text>
</svg>
