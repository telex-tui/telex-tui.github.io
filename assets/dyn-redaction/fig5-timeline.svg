<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530" role="img" aria-labelledby="fig3-title fig3-desc">
  <title id="fig3-title">When the writer type O is picked, relative to building the vtable</title>
  <desc id="fig3-desc">Three moments: writing the dyn type, turning &amp;bar into a dyn value (when its vtable is picked; every vtable is written at compile time), and each call. Top row, O on the trait: dyn RenderTo&lt;String&gt; picks O in the type, so the vtable picked at step 2 has one render_to slot for O = String, and the call has nothing left to pick. Bottom row, O on the method: dyn Widget says nothing about O, so the vtable picked at step 2 would need a slot for every O anyone might use; O is only picked at step 3, too late.</desc>
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      .sans, .sans text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
    <marker id="f3arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="800" height="530" fill="#0d1117"/>
  <rect x="10" y="10" width="780" height="510" rx="8" fill="#161b22" stroke="#30363d"/>
  <text class="sans" x="30" y="42" font-size="15" fill="#e6edf3">A vtable is fixed before the handle exists.</text>
  <text class="sans" x="30" y="64" font-size="13" fill="#8b949e">The same writer type, O, picked at two different moments.</text>

  <!-- the timeline -->
  <g class="sans" font-size="12.5" fill="#e6edf3" text-anchor="middle">
    <text x="200" y="96">1 · you write the dyn type</text>
    <text x="430" y="96">2 · &amp;bar becomes dyn: vtable picked</text>
    <text x="660" y="96">3 · each call through it</text>
  </g>
  <line x1="110" y1="110" x2="772" y2="110" stroke="#8b949e" stroke-width="1.5" marker-end="url(#f3arrow)"/>
  <g fill="#8b949e"><circle cx="200" cy="110" r="4"/><circle cx="430" cy="110" r="4"/><circle cx="660" cy="110" r="4"/></g>

  <!-- ===== Row A: O on the trait ===== -->
  <text x="30" y="146" font-size="13" fill="#e6edf3">trait RenderTo&lt;O&gt; { fn render_to(&amp;self, out: &amp;mut O); }<tspan class="sans" dx="10" font-size="12.5" fill="#8b949e">O on the trait</tspan></text>

  <rect x="115" y="158" width="170" height="104" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="200" y="188" font-size="12.5" fill="#e6edf3" text-anchor="middle">dyn RenderTo&lt;String&gt;</text>
  <text class="sans" x="200" y="214" font-size="12.5" fill="#e6edf3" text-anchor="middle">O = String, in the type</text>
  <text class="sans" x="200" y="236" font-size="12" fill="#8b949e" text-anchor="middle">picked before step 2</text>

  <rect x="320" y="158" width="220" height="104" rx="6" fill="#1c2128" stroke="#d29922"/>
  <text class="sans" x="335" y="176" font-size="12" fill="#d29922">vtable · Self = ProgressBar</text>
  <g stroke="#30363d" fill="none"><rect x="335" y="184" width="190" height="72"/>
    <line x1="335" y1="202" x2="525" y2="202"/><line x1="335" y1="220" x2="525" y2="220"/><line x1="335" y1="238" x2="525" y2="238"/></g>
  <g font-size="11" fill="#8b949e"><text x="343" y="197">drop</text><text x="343" y="215">size 8</text><text x="343" y="233">align 4</text></g>
  <text x="343" y="251" font-size="11" fill="#3fb950">render_to, O = String</text>

  <rect x="575" y="158" width="170" height="104" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="660" y="188" font-size="12.5" fill="#e6edf3" text-anchor="middle">a.render_to(&amp;mut s)</text>
  <text class="sans" x="660" y="214" font-size="12.5" fill="#e6edf3" text-anchor="middle">✓ nothing left to pick</text>
  <text class="sans" x="660" y="236" font-size="12" fill="#8b949e" text-anchor="middle">one slot, already there</text>

  <!-- ===== Row B: O on the method ===== -->
  <text x="30" y="300" font-size="13" fill="#e6edf3">trait Widget { fn render_to&lt;<tspan fill="#f85149">O</tspan>&gt;(&amp;self, out: &amp;mut O); }<tspan class="sans" dx="10" font-size="12.5" fill="#8b949e">O on the method</tspan></text>

  <rect x="115" y="312" width="170" height="146" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="200" y="342" font-size="12.5" fill="#e6edf3" text-anchor="middle">dyn Widget</text>
  <text class="sans" x="200" y="368" font-size="12.5" fill="#8b949e" text-anchor="middle">O isn't in the type</text>
  <text class="sans" x="200" y="390" font-size="12" fill="#8b949e" text-anchor="middle">nothing to pick yet</text>

  <rect x="320" y="312" width="220" height="146" rx="6" fill="#1c2128" stroke="#f85149"/>
  <text class="sans" x="335" y="330" font-size="12" fill="#d29922">vtable · Self = ProgressBar</text>
  <g stroke="#30363d" fill="none"><rect x="335" y="338" width="190" height="54"/>
    <line x1="335" y1="356" x2="525" y2="356"/><line x1="335" y1="374" x2="525" y2="374"/></g>
  <g font-size="11" fill="#8b949e"><text x="343" y="351">drop</text><text x="343" y="369">size 8</text><text x="343" y="387">align 4</text></g>
  <g stroke="#f85149" stroke-dasharray="4 3" fill="none">
    <rect x="335" y="392" width="190" height="18"/><rect x="335" y="410" width="190" height="18"/><rect x="335" y="428" width="190" height="18"/>
  </g>
  <g font-size="11" fill="#f85149">
    <text x="343" y="405">render_to::&lt;String&gt; ?</text>
    <text x="343" y="423">render_to::&lt;Formatter&gt; ?</text>
    <text x="343" y="441">render_to::&lt;…every O…&gt; ?</text>
  </g>

  <rect x="575" y="312" width="170" height="146" rx="6" fill="#1c2128" stroke="#f85149"/>
  <text x="660" y="342" font-size="12.5" fill="#e6edf3" text-anchor="middle">w.render_to(&amp;mut s)</text>
  <text class="sans" x="660" y="368" font-size="12.5" fill="#f85149" text-anchor="middle">O = String, picked here</text>
  <text class="sans" x="660" y="390" font-size="12" fill="#8b949e" text-anchor="middle">too late: the table</text>
  <text class="sans" x="660" y="406" font-size="12" fill="#8b949e" text-anchor="middle">was fixed at step 2</text>

  <text class="sans" x="30" y="490" font-size="12.5" fill="#8b949e">The vtable picked at step 2 was written at compile time, for <tspan fill="#e6edf3">Self</tspan> = ProgressBar. A method's own <tspan fill="#e6edf3">O</tspan> arrives only at step 3,</text>
  <text class="sans" x="30" y="508" font-size="12.5" fill="#8b949e">and no finite table holds a body for every <tspan fill="#e6edf3">O</tspan>. So rustc refuses <tspan fill="#e6edf3">dyn Widget</tspan>: error E0038.</text>
</svg>
