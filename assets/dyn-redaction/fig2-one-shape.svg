<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">A Vec of Box&lt;dyn Widget&gt; holding a Label and a ProgressBar</title>
  <desc id="fig2-desc">The vector's buffer holds two elements of identical shape, each a data word and a vtable word. Element 0 points at a 16-byte Label and at the Label-as-Widget vtable (size 16, align 8). Element 1 points at an 8-byte ProgressBar and at the ProgressBar-as-Widget vtable (size 8, align 4). One draw function, compiled once, calls render through whichever vtable the element carries.</desc>
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      .sans, .sans text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
    <pattern id="f2hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#161b22"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#30363d" stroke-width="2"/>
    </pattern>
    <marker id="f2arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/>
    </marker>
    <marker id="f2arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
  </defs>

  <rect width="800" height="560" fill="#0d1117"/>
  <rect x="10" y="10" width="780" height="535" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="30" y="42" font-size="15" fill="#e6edf3">let screen: <tspan fill="#58a6ff">Vec&lt;Box&lt;dyn Widget&gt;&gt;</tspan> = vec![…];</text>
  <text class="sans" x="30" y="64" font-size="13" fill="#8b949e">Every element has the same shape: two words. What differs is where the words point.</text>

  <!-- the Vec's buffer -->
  <text class="sans" x="70" y="106" font-size="12" fill="#8b949e">screen's buffer (heap)</text>
  <g font-size="12" fill="#8b949e" text-anchor="end">
    <text x="62" y="167">[0]</text>
    <text x="62" y="277">[1]</text>
  </g>
  <rect x="70" y="118" width="120" height="44" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <rect x="70" y="162" width="120" height="44" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
  <rect x="70" y="228" width="120" height="44" fill="#1c2128" stroke="#bc8cff" stroke-width="1.5"/>
  <rect x="70" y="272" width="120" height="44" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
  <g font-size="12.5" fill="#e6edf3" text-anchor="middle">
    <text x="130" y="145">data</text><text x="130" y="189">vtable</text>
    <text x="130" y="255">data</text><text x="130" y="299">vtable</text>
  </g>
  <text class="sans" x="130" y="336" font-size="12" fill="#8b949e" text-anchor="middle">16 bytes each</text>

  <!-- the Label -->
  <text x="420" y="92"><tspan font-size="14" font-weight="bold" fill="#3fb950">Label</tspan><tspan class="sans" dx="10" font-size="12.5" fill="#8b949e">size 16 · align 8</tspan></text>
  <text x="580" y="112" font-size="12" fill="#58a6ff" text-anchor="middle">text: &amp;'static str</text>
  <rect x="420" y="118" width="320" height="44" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="580" y1="119" x2="580" y2="161" stroke="#30363d"/>
  <g font-size="12.5" fill="#e6edf3" text-anchor="middle">
    <text x="500" y="145">ptr to "CPU"</text><text x="660" y="145">len 3</text>
  </g>
  <g font-size="11" fill="#8b949e" text-anchor="middle">
    <text x="420" y="178">0</text><text x="580" y="178">8</text><text x="740" y="178">16</text>
  </g>

  <!-- the ProgressBar, same scale: 20 px per byte -->
  <text x="420" y="212"><tspan font-size="14" font-weight="bold" fill="#3fb950">ProgressBar</tspan><tspan class="sans" dx="10" font-size="12.5" fill="#8b949e">size 8 · align 4</tspan></text>
  <rect x="420" y="228" width="80" height="44" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="440" y1="229" x2="440" y2="271" stroke="#30363d"/>
  <line x1="460" y1="229" x2="460" y2="271" stroke="#30363d"/>
  <line x1="480" y1="229" x2="480" y2="271" stroke="#30363d"/>
  <rect x="500" y="228" width="20" height="44" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <rect x="520" y="228" width="60" height="44" fill="url(#f2hatch)" stroke="#30363d"/>
  <g font-size="10.5" fill="#e6edf3" text-anchor="middle">
    <text x="430" y="254">0a</text><text x="450" y="254">00</text><text x="470" y="254">00</text><text x="490" y="254">00</text>
    <text x="510" y="254">07</text>
  </g>

  <!-- data arrows -->
  <line x1="190" y1="140" x2="414" y2="140" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#f2arrowP)"/>
  <line x1="190" y1="250" x2="414" y2="250" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#f2arrowP)"/>
  <!-- vtable arrows -->
  <path d="M70 184 H44 V384" fill="none" stroke="#d29922" stroke-width="1.5" marker-end="url(#f2arrowO)"/>
  <path d="M190 294 H700 V384" fill="none" stroke="#d29922" stroke-width="1.5" marker-end="url(#f2arrowO)"/>

  <!-- the two vtables -->
  <text x="60" y="380" font-size="13" fill="#d29922">vtable: Label as Widget</text>
  <rect x="30" y="388" width="350" height="88" rx="4" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
  <text x="420" y="380" font-size="13" fill="#d29922">vtable: ProgressBar as Widget</text>
  <rect x="420" y="388" width="350" height="88" rx="4" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
  <g stroke="#30363d">
    <line x1="30" y1="410" x2="380" y2="410"/><line x1="30" y1="432" x2="380" y2="432"/><line x1="30" y1="454" x2="380" y2="454"/>
    <line x1="100" y1="388" x2="100" y2="476"/>
    <line x1="420" y1="410" x2="770" y2="410"/><line x1="420" y1="432" x2="770" y2="432"/><line x1="420" y1="454" x2="770" y2="454"/>
    <line x1="490" y1="388" x2="490" y2="476"/>
  </g>
  <g font-size="12" fill="#8b949e">
    <text x="40" y="403">drop</text><text x="40" y="425">size</text><text x="40" y="447">align</text><text x="40" y="469">render</text>
    <text x="430" y="403">drop</text><text x="430" y="425">size</text><text x="430" y="447">align</text><text x="430" y="469">render</text>
  </g>
  <g font-size="12" fill="#e6edf3">
    <text x="110" y="403">→ drop_in_place::&lt;Label&gt;</text><text x="110" y="425">16</text><text x="110" y="447">8</text><text x="110" y="469">→ &lt;Label as Widget&gt;::render</text>
    <text x="500" y="403">→ drop_in_place::&lt;ProgressBar&gt;</text><text x="500" y="425">8</text><text x="500" y="447">4</text><text x="500" y="469">→ &lt;ProgressBar as Widget&gt;::render</text>
  </g>

  <text class="sans" x="30" y="508" font-size="12.5" fill="#8b949e"><tspan font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#e6edf3">fn draw(w: &amp;dyn Widget)</tspan> is compiled once. Each call reads <tspan font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#e6edf3">render</tspan>'s address from the vtable</text>
  <text class="sans" x="30" y="527" font-size="12.5" fill="#8b949e">that came with the pointer. The type lives in the vtable, not in the Vec.</text>
</svg>
