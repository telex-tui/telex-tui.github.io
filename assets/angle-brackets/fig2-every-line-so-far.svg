  <path d="M89.0,276.5 C89.0,260.5 168.0,260.5 168.0,274.5" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#abF2-arrow)"/>
  <text x="128.5" y="260.5" font-size="11" text-anchor="middle" xml:space="preserve"><tspan fill="#8b949e">same T</tspan></text>
  <text x="360" y="292" font-size="14" xml:space="preserve"><tspan fill="#d29922">For any type T</tspan><tspan fill="#c9d1d9">, here are methods for a Pair </tspan><tspan fill="#58a6ff">of T</tspan><tspan fill="#c9d1d9">.</tspan></text>
  <rect x="118.5" y="336.5" width="49.0" height="18.9" rx="4" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-width="1.4"/>
  <text class="m" x="36.0 45.0 54.0 63.0 72.0 81.0 90.0 99.0 108.0 120.5 129.5 138.5 147.5 156.5" y="350" font-size="15" fill="#e6edf3" xml:space="preserve">impl Pair&lt;i32&gt;</text>
  <text x="360" y="350" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">Here are methods for a Pair </tspan><tspan fill="#58a6ff">of i32</tspan><tspan fill="#c9d1d9"> only.</tspan></text>
