<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" role="img" aria-labelledby="abF4-title abF4-desc">
  <title id="abF4-title">impl&lt;I: Iterator&lt;Item = i32&gt;&gt; Iterator for Plus&lt;I&gt;, read aloud</title>
  <desc id="abF4-desc">The line impl&lt;I: Iterator&lt;Item = i32&gt;&gt; Iterator for Plus&lt;I&gt;, then the same line word by word with an English gloss under each piece: impl, implement; &lt;I, for any type I; : Iterator, that's an iterator; &lt;Item = i32&gt;, of i32; the closing bracket; Iterator, Iterator; for, for; Plus, a Plus; &lt;I&gt;, of I. Then as a sentence: for any type I that's an iterator of i32, here's how a Plus of I is an iterator. Orange marks the brackets that name I, green the requirement, and blue the brackets that fill a blank in.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    </style>
    <marker id="abF4-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="800" height="290" fill="#0d1117"/>
  <rect x="10" y="10" width="780" height="270" rx="8" fill="#161b22" stroke="#30363d"/>
  <text class="m" x="160.0 169.6 179.2 188.8" y="54" font-size="16" fill="#e6edf3" xml:space="preserve">impl</text>
  <text class="m" x="198.4 208.0" y="54" font-size="16" fill="#d29922" xml:space="preserve">&lt;I</text>
  <text class="m" x="217.6 227.2 236.8 246.4 256.0 265.6 275.2 284.8 294.4 304.0" y="54" font-size="16" fill="#3fb950" xml:space="preserve">: Iterator</text>
  <text class="m" x="313.6 323.2 332.8 342.4 352.0 361.6 371.2 380.8 390.4 400.0 409.6 419.2" y="54" font-size="16" fill="#58a6ff" xml:space="preserve">&lt;Item = i32&gt;</text>
  <text class="m" x="428.8" y="54" font-size="16" fill="#d29922" xml:space="preserve">&gt;</text>
  <text class="m" x="438.4 448.0 457.6 467.2 476.8 486.4 496.0 505.6 515.2 524.8 534.4 544.0 553.6 563.2 572.8 582.4 592.0 601.6" y="54" font-size="16" fill="#e6edf3" xml:space="preserve"> Iterator for Plus</text>
  <text class="m" x="611.2 620.8 630.4" y="54" font-size="16" fill="#58a6ff" xml:space="preserve">&lt;I&gt;</text>
  <line x1="26" y1="78" x2="774" y2="78" stroke="#30363d"/>
  <text x="36" y="104" font-size="11.5" font-weight="600" letter-spacing="0.08em" xml:space="preserve"><tspan fill="#8b949e">WORD BY WORD</tspan></text>
  <text class="m" x="74.1 83.1 92.1 101.1" y="138" font-size="15" fill="#e6edf3" xml:space="preserve">impl</text>
  <path d="M73.1,144 V148 H111.1 V144" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <text x="92.1" y="170" font-size="13.5" text-anchor="middle" xml:space="preserve"><tspan fill="#c9d1d9">implement</tspan></text>
  <text class="m" x="180.7 189.7" y="138" font-size="15" fill="#d29922" xml:space="preserve">&lt;I</text>
  <path d="M179.7,144 V148 H199.7 V144" fill="none" stroke="#d29922" stroke-width="1.2"/>
  <text x="189.7" y="170" font-size="13.5" text-anchor="middle" xml:space="preserve"><tspan fill="#d29922">for any type I</tspan></text>
  <text class="m" x="263.1 272.1 281.1 290.1 299.1 308.1 317.1 326.1 335.1 344.1" y="138" font-size="15" fill="#3fb950" xml:space="preserve">: Iterator</text>
  <path d="M262.1,144 V148 H354.1 V144" fill="none" stroke="#3fb950" stroke-width="1.2"/>
  <text x="308.1" y="170" font-size="13.5" text-anchor="middle" xml:space="preserve"><tspan fill="#3fb950">that’s an iterator</tspan></text>
  <text class="m" x="381.3 390.3 399.3 408.3 417.3 426.3 435.3 444.3 453.3 462.3 471.3 480.3" y="138" font-size="15" fill="#58a6ff" xml:space="preserve">&lt;Item = i32&gt;</text>
  <path d="M380.3,144 V148 H490.3 V144" fill="none" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="435.3" y="170" font-size="13.5" text-anchor="middle" xml:space="preserve"><tspan fill="#58a6ff">of i32</tspan></text>
  <text class="m" x="505.3" y="138" font-size="15" fill="#d29922" xml:space="preserve">&gt;</text>
  <path d="M504.3,144 V148 H515.3 V144" fill="none" stroke="#d29922" stroke-width="1.2"/>
  <text class="m" x="530.3 539.3 548.3 557.3 566.3 575.3 584.3 593.3" y="138" font-size="15" fill="#e6edf3" xml:space="preserve">Iterator</text>
  <path d="M529.3,144 V148 H603.3 V144" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <text x="566.3" y="170" font-size="13.5" text-anchor="middle" xml:space="preserve"><tspan fill="#c9d1d9">Iterator</tspan></text>
  <text class="m" x="618.3 627.3 636.3" y="138" font-size="15" fill="#e6edf3" xml:space="preserve">for</text>
  <path d="M617.3,144 V148 H646.3 V144" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <text x="631.8" y="170" font-size="13.5" text-anchor="middle" xml:space="preserve"><tspan fill="#c9d1d9">for</tspan></text>
  <text class="m" x="663.3 672.3 681.3 690.3" y="138" font-size="15" fill="#e6edf3" xml:space="preserve">Plus</text>
  <path d="M662.3,144 V148 H700.3 V144" fill="none" stroke="#8b949e" stroke-width="1.2"/>
  <text x="681.3" y="170" font-size="13.5" text-anchor="middle" xml:space="preserve"><tspan fill="#c9d1d9">a Plus</tspan></text>
  <text class="m" x="717.4 726.4 735.4" y="138" font-size="15" fill="#58a6ff" xml:space="preserve">&lt;I&gt;</text>
  <path d="M716.4,144 V148 H745.4 V144" fill="none" stroke="#58a6ff" stroke-width="1.2"/>
  <text x="730.9" y="170" font-size="13.5" text-anchor="middle" xml:space="preserve"><tspan fill="#58a6ff">of I</tspan></text>
  <line x1="26" y1="196" x2="774" y2="196" stroke="#30363d"/>
  <text x="36" y="222" font-size="11.5" font-weight="600" letter-spacing="0.08em" xml:space="preserve"><tspan fill="#8b949e">AS A SENTENCE</tspan></text>
  <text x="36" y="254" font-size="15.5" xml:space="preserve"><tspan fill="#d29922">For any type I</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#3fb950">that’s an iterator</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#58a6ff">of i32</tspan><tspan fill="#c9d1d9">, here’s how a Plus </tspan><tspan fill="#58a6ff">of I</tspan><tspan fill="#c9d1d9"> is an iterator.</tspan></text>
</svg>
