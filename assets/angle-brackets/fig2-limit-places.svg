<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-labelledby="abF2-title abF2-desc">
  <title id="abF2-title">Three places to write the same limit</title>
  <desc id="abF2-desc">Three versions of fn show, each limiting its type to Display. Top: the limit sits inside the declaring brackets, show&lt;T: Display&gt;. Middle: the brackets only declare, show&lt;T&gt;, and the limit is in a where clause after the return type. Bottom: nothing is circled, because no brackets declare. Inside Pair&#x27;s brackets, impl Display declares a type parameter with no name and limits it to Display. Pair&#x27;s brackets fill in its name in all three.</desc>
  <rect width="800" height="260" fill="#0d1117"/>
  <rect x="10" y="10" width="780" height="240" rx="8" fill="#161b22" stroke="#30363d"/>
  <g style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">
    <rect x="36" y="31" width="34" height="20" rx="10" fill="none" stroke="#d29922" stroke-width="2"/>
    <text x="80" y="46">declares new names</text>
    <line x1="236.0" y1="48" x2="270.0" y2="48" stroke="#58a6ff" stroke-width="2.5"/>
    <text x="280.0" y="46">fills names in</text>
    <rect x="408.0" y="32" width="34" height="18" rx="3" fill="#3fb950" fill-opacity="0.28"/>
    <text x="452.0" y="46">the limit</text>
  </g>
  <line x1="26" y1="68" x2="774" y2="68" stroke="#30363d"/>
  <rect x="134.0" y="97" width="65.0" height="18" rx="3" fill="#3fb950" fill-opacity="0.28"/>
  <text x="36.0 45.0 54.0 63.0 72.0 81.0 90.0 99.0 108.0 117.0 126.0 135.0 144.0 153.0 162.0 171.0 180.0 189.0 198.0 207.0 216.0 225.0 234.0 243.0 252.0 261.0 270.0 279.0 288.0 297.0 306.0 315.0 324.0 333.0 342.0 351.0 360.0 369.0 378.0 387.0 396.0 405.0 414.0 423.0" y="110" font-size="15" fill="#e6edf3" style="font-family:'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace">fn show&lt;T: Display&gt;(pair: Pair&lt;T&gt;) -&gt; String</text>
  <line x1="306.0" y1="116" x2="333.0" y2="116" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="96.5" y="92" width="113.0" height="30" rx="15" fill="none" stroke="#d29922" stroke-width="2"/>
