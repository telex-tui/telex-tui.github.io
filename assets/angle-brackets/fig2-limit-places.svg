  <rect x="440.0" y="147" width="65.0" height="18" rx="3" fill="#3fb950" fill-opacity="0.28"/>
  <text x="36.0 45.0 54.0 63.0 72.0 81.0 90.0 99.0 108.0 117.0 126.0 135.0 144.0 153.0 162.0 171.0 180.0 189.0 198.0 207.0 216.0 225.0 234.0 243.0 252.0 261.0 270.0 279.0 288.0 297.0 306.0 315.0 324.0 333.0 342.0 351.0 360.0 369.0 378.0 387.0 396.0 405.0 414.0 423.0 432.0 441.0 450.0 459.0 468.0 477.0 486.0 495.0" y="160" font-size="15" fill="#e6edf3" style="font-family:'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace">fn show&lt;T&gt;(pair: Pair&lt;T&gt;) -&gt; String where T: Display</text>
