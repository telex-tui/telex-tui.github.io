<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="abF3-title abF3-desc">
  <title id="abF3-title">One requirement, three places to write it</title>
  <desc id="abF3-desc">Three versions of fn show, each requiring its type to implement Display, each with a plain-English reading. First, in the brackets: fn show&lt;T: Display&gt;(pair: Pair&lt;T&gt;) -&gt; String reads 'for any type T that implements Display, show takes a Pair of T and returns a String'. Second, in a where clause: fn show&lt;T&gt;(pair: Pair&lt;T&gt;) -&gt; String where T: Display reads 'for any type T, show takes a Pair of T and returns a String, where T implements Display'. Third, in the argument: fn show(pair: Pair&lt;impl Display&gt;) -&gt; String reads 'show takes a Pair of some type that implements Display, and returns a String'. Only the first two give the blank a name.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    </style>
    <marker id="abF3-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
