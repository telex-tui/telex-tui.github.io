<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chords as Shapes</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --code: #1c2128; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --sticker: #f2cc60; --tri: #3fb950; --g3: #bc8cff; --g4: #58a6ff; --g5: #f778ba; --g8: #8b949e;
  }
  html, body { margin: 0; background: transparent; color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; }
  .wrap { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  svg { display: block; width: 100%; overflow: visible; touch-action: manipulation; }
  svg text { font-family: inherit; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin: 10px 0 0; }
  .row > span { font-size: 12px; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button, .btn, .chips button { background: transparent; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
  .seg button { border: 0; padding: 5px 11px; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--code); color: var(--text); }
  .btn { border: 1px solid var(--border); border-radius: 6px; padding: 5px 11px; color: var(--text); }
  .btn.main { border-color: var(--sticker); }
  .btn:disabled { opacity: .45; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
  .chips button[aria-pressed="true"] { color: var(--text); background: var(--code); }
  .chips button[data-q="3"][aria-pressed="true"] { border-color: var(--g3); }
  .chips button[data-q="4"][aria-pressed="true"] { border-color: var(--g4); }
  .chips button[data-q="5"][aria-pressed="true"] { border-color: var(--g5); }
  .chips button[data-q="8"][aria-pressed="true"] { border-color: var(--g8); }
  .readout { background: var(--code); border-radius: 6px; padding: 8px 10px; font-size: 13.5px; min-height: 3.1em; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; border: 1px solid var(--tri); color: var(--tri); border-radius: 999px; padding: 0 8px; font-size: 12.5px; margin-left: 4px; }
  .rule { font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 12px; }
  .rule b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <svg id="v" aria-label="The frequency ring. Tap up to three notes to make a chord."></svg>
  <div class="row">
    <span>Tuning</span>
    <div class="seg" role="group" aria-label="Tuning">
      <button data-t="pure" aria-pressed="true">Pure, for C</button>
      <button data-t="piano" aria-pressed="false">Piano</button>
    </div>
    <button class="btn main" id="play">&#9654; Play chord</button>
    <button class="btn" id="clear">Clear</button>
  </div>
  <div class="row">
    <span>Ring's root</span>
    <div class="chips" id="roots"></div>
    <button class="btn" id="toChord">Root = chord's first note</button>
  </div>
  <div class="row"><span>Grids</span><div class="chips" id="grids"></div></div>
  <div class="readout" id="out" aria-live="polite"></div>
  <p class="rule" id="rule"></p>
</div>

<script>
(() => {
  const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
  const C4 = 261.6256;
  // Pure tuning for C: each note as a whole-number fraction of C.
  const PURE = [[1, 1], [16, 15], [9, 8], [6, 5], [5, 4], [4, 3], [45, 32], [3, 2], [8, 5], [5, 3], [9, 5], [15, 8]];
  let tune = 'pure', root = 0, picks = [];
  const grid = { 3: false, 4: false, 5: false, 8: false };

  const ratio = j => tune === 'pure' ? PURE[j][0] / PURE[j][1] : 2 ** (j / 12);       // to C
  const fold = x => x / 2 ** Math.floor(Math.log2(x + 1e-12));
  const angle = j => 360 * (fold(ratio(j) / ratio(root)) - 1);                     // the frequency ring's rule
  const gcd = (a, b) => { while (b) [a, b] = [b, a % b]; return a; };

  // Stack the picks in tap order: each note sits above the one before (first tap is the bottom).
  function stack() {
    const out = [];
    for (const j of picks) {
      let f = ratio(j);
      if (out.length) { while (f <= out[out.length - 1] + 1e-9) f *= 2; }
      out.push(f);
    }
    return out;
  }
  // The same stack as whole numbers (pure tuning only).
  function wholeNumbers() {
    if (tune !== 'pure' || picks.length < 2) return null;
    const fr = []; let prev = null;
    for (const j of picks) {
      let [p, q] = PURE[j];
      if (prev) while (p / q <= prev[0] / prev[1] + 1e-9) p *= 2;
      const g = gcd(p, q); fr.push([p / g, q / g]); prev = [p / g, q / g];
    }
    const L = fr.reduce((a, [, q]) => a * q / gcd(a, q), 1);
    let ints = fr.map(([p, q]) => p * L / q);
    const G = ints.reduce((a, b) => gcd(a, b));
    return ints.map(x => x / G);
  }

  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const a in attrs) e.setAttribute(a, attrs[a]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const cv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const COL = {}; ['text','muted','border','sticker','accent','tri','g3','g4','g5','g8','code','card'].forEach(k => COL[k] = cv('--' + k));
  const polar = (cx, cy, R, d) => [cx + R * Math.sin(d * Math.PI / 180), cy - R * Math.cos(d * Math.PI / 180)];

  // ---- Sound ----
  let ac;
  function playChord() {
    if (!picks.length) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const t0 = ac.currentTime + 0.02, out = ac.createGain();
      out.gain.setValueAtTime(0, t0); out.gain.linearRampToValueAtTime(0.07, t0 + 0.03);
      out.gain.setValueAtTime(0.07, t0 + 2.4); out.gain.linearRampToValueAtTime(0, t0 + 3);
      out.connect(ac.destination);
      stack().forEach((r, i) => {
        const f = C4 * r, t = t0 + 0.12 * i;
        for (let n = 1; n <= 8; n++) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f * n; g.gain.value = 1 / n; o.connect(g); g.connect(out); o.start(t); o.stop(t0 + 3.05); }
      });
    } catch (e) {}
  }

  // Interior angles of the triangle drawn through three points on the ring.
  function triAngles(ds) {
    const s = [...ds].sort((a, b) => a - b);
    const arcs = [s[1] - s[0], s[2] - s[1], 360 - (s[2] - s[0])];
    return arcs.map(a => a / 2);          // each interior angle is half the arc opposite it
  }
  function shapeName(angs) {
    const eq = (a, b) => Math.abs(a - b) < 0.05;
    const near = (a, b) => Math.abs(a - b) < 3;
    const right = angs.some(a => eq(a, 90)), equi = angs.every(a => eq(a, 60));
    const iso = eq(angs[0], angs[1]) || eq(angs[1], angs[2]) || eq(angs[0], angs[2]);
    if (equi) return ['equilateral', true];
    if (right && iso) return ['right-angled, with two equal sides', true];
    if (right) return ['right-angled', true];
    if (iso) return ['symmetric (two equal sides)', true];
    const nearRight = angs.some(a => near(a, 90)), nearEqui = angs.every(a => near(a, 60));
    const nearIso = near(angs[0], angs[1]) || near(angs[1], angs[2]) || near(angs[0], angs[2]);
    if (nearEqui) return ['almost equilateral', false];
    if (nearRight && nearIso) return ['almost right-angled, with two almost equal sides', false];
    if (nearRight) return ['almost right-angled', false];
    if (nearIso) return ['almost symmetric', false];
    return ['lopsided', false];
  }

  function draw() {
    const w = Math.max(280, Math.round($('v').getBoundingClientRect().width || 600));
    const R = Math.min(w / 2 - 44, 150), cx = w / 2, cy = R + 38, H = 2 * R + 78;
    const svg = $('v'); svg.replaceChildren();
    svg.setAttribute('viewBox', `0 0 ${w} ${H}`); svg.setAttribute('height', H);
    for (const q of [3, 4, 5, 8]) if (grid[q]) for (let i = 0; i < q; i++) {
      const [x, y] = polar(cx, cy, R, 360 * i / q);
      el('line', { x1: cx, y1: cy, x2: x, y2: y, stroke: COL['g' + q], 'stroke-width': 1.2, 'stroke-dasharray': '4 4', 'stroke-opacity': 0.8 }, svg);
    }
    el('circle', { cx, cy, r: R, fill: 'none', stroke: COL.border, 'stroke-width': 2 }, svg);
    for (const [q, lab] of [[0, '×1'], [90, '×1¼'], [180, '×1½'], [270, '×1¾']]) {
      const [a1, b1] = polar(cx, cy, R - 6, q), [a2, b2] = polar(cx, cy, R + 6, q);
      el('line', { x1: a1, y1: b1, x2: a2, y2: b2, stroke: COL.muted, 'stroke-width': 1.4 }, svg);
    }
    if (picks.length >= 2) {
      const pts = picks.map(j => polar(cx, cy, R, angle(j)).join(','));
      el(picks.length === 3 ? 'polygon' : 'polyline', { points: pts.join(' '), fill: picks.length === 3 ? COL.tri : 'none', 'fill-opacity': 0.12, stroke: COL.tri, 'stroke-width': 2, 'stroke-linejoin': 'round' }, svg);
    }
    if (picks.length === 3) {
      const [nm] = shapeName(triAngles(picks.map(angle)));
      const words = nm.split(', ');
      words.forEach((t, i) => el('text', { x: cx, y: cy + 4 + (i - (words.length - 1) / 2) * 16, 'text-anchor': 'middle', 'font-size': 13, fill: COL.text, 'font-weight': 600 }, svg, t));
    }
    for (let j = 0; j < 12; j++) {
      const d = angle(j), [x, y] = polar(cx, cy, R, d), [lx, ly] = polar(cx, cy, R + 21, d);
      const k = picks.indexOf(j), on = k >= 0, isRoot = j === root;
      const g = el('g', { style: 'cursor:pointer', role: 'button', 'aria-label': (on ? 'Remove ' : 'Add ') + NAMES[j] }, svg);
      el('circle', { cx: x, cy: y, r: 15, fill: 'transparent' }, g);
      el('circle', { cx: x, cy: y, r: on ? 7.5 : 5, fill: on ? COL.tri : j === 0 ? COL.sticker : COL.card, stroke: isRoot ? COL.sticker : on ? COL.tri : COL.text, 'stroke-width': isRoot ? 2.5 : 1.2 }, g);
      el('text', { x: lx, y: ly + 4, 'text-anchor': 'middle', 'font-size': 12, fill: on || isRoot ? COL.text : COL.muted, 'font-weight': on ? 600 : 400 }, g, NAMES[j]);
      if (on) { const [nx, ny] = polar(cx, cy, R - 17, d); el('text', { x: nx, y: ny + 4, 'text-anchor': 'middle', 'font-size': 10, fill: COL.tri }, g, k + 1); }
      g.addEventListener('click', () => { tap(j); });
    }
  }

  function tap(j) {
    const k = picks.indexOf(j);
    if (k >= 0) picks.splice(k, 1);
    else { picks.push(j); if (picks.length > 3) picks.shift(); }
    update();
    if (k < 0) playChord();
  }

  function update() {
    draw();
    let msg;
    if (!picks.length) msg = 'Tap three notes to make a chord. The first note you tap is the bottom of the chord.';
    else if (picks.length < 3) msg = `${picks.map(j => NAMES[j]).join(' – ')}: tap ${3 - picks.length} more.`;
    else {
      const angs = triAngles(picks.map(angle)), [nm, exact] = shapeName(angs);
      msg = `<b>${picks.map(j => NAMES[j]).join(' – ')}</b> on ${NAMES[root]}’s ring: ${exact ? '' : ''}<b>${nm}</b>. Corners ${angs.map(a => a.toFixed(1) + '°').sort((a, b) => parseFloat(b) - parseFloat(a)).join(', ')}.`;
    }
    const wn = wholeNumbers();
    if (wn) msg += ` <span class="badge">${wn.join(':')}</span>`;
    else if (tune === 'piano' && picks.length >= 2) msg += ' <span style="color:var(--muted)">No whole numbers on a piano: every step is ×1.0595.</span>';
    $('out').innerHTML = msg;
    $('rule').innerHTML = `<b>Rule:</b> each note sits at its frequency’s ratio to the ring’s root (${NAMES[root]}), folded into one octave. ` +
      (tune === 'pure' ? '<b>Pure, for C:</b> every note is a whole-number fraction of C (D is 9/8, E 5/4, F 4/3, G 3/2, A 5/3, B 15/8, and so on).' : '<b>Piano:</b> every key is ×1.0595 above the one below.') +
      ' The badge stacks the chord in tap order and writes it as whole numbers.';
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === tune)));
    [...$('roots').children].forEach((b, i) => b.setAttribute('aria-pressed', String(i === root)));
    [...$('grids').children].forEach(b => b.setAttribute('aria-pressed', String(grid[b.dataset.q])));
    $('toChord').disabled = !picks.length || picks[0] === root;
    try { parent.postMessage({ tuningEmbed: 'chords', height: Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height) + 2 }, '*'); } catch (e) {}
  }

  NAMES.forEach((n, i) => { const b = document.createElement('button'); b.textContent = n; b.addEventListener('click', () => { root = i; update(); }); $('roots').appendChild(b); });
  [[3, 'thirds'], [4, 'quarters'], [5, 'fifths'], [8, 'eighths']].forEach(([q, lab]) => { const b = document.createElement('button'); b.textContent = lab; b.dataset.q = q; b.addEventListener('click', () => { grid[q] = !grid[q]; update(); }); $('grids').appendChild(b); });
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { tune = b.dataset.t; update(); }));
  $('play').addEventListener('click', playChord);
  $('clear').addEventListener('click', () => { picks = []; update(); });
  $('toChord').addEventListener('click', () => { if (picks.length) { root = picks[0]; update(); } });
  new ResizeObserver(() => update()).observe(document.querySelector('.wrap'));
  update();
})();
</script>
</body>
</html>
