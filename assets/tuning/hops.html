<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hop to the Opposite</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --code: #1c2128; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --sticker: #f2cc60; --good: #3fb950; --dial: #bc8cff; --chain: #f0883e;
  }
  html, body { margin: 0; background: transparent; color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; }
  .wrap { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .pair { grid-template-columns: 1fr; } }
  .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 2px; }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { font-family: inherit; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0 8px; }
  .btn { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .btn.main { border-color: var(--chain); }
  .btn:disabled { opacity: .45; cursor: default; }
  .readout { background: var(--code); border-radius: 6px; padding: 8px 10px; font-size: 13.5px; min-height: 3.1em; font-variant-numeric: tabular-nums; }
  .rule { font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 12px; }
  .rule b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="pair">
    <div><p class="lbl">The root's ring</p><svg id="ring" aria-label="The frequency ring of the current root"></svg></div>
    <div><p class="lbl">The chain of hops</p><svg id="chain" aria-label="Each hop's root, placed one twelfth of a turn further round"></svg></div>
  </div>
  <div class="controls">
    <button class="btn main" id="hop">Hop to the opposite &#9654;</button>
    <button class="btn" id="reset">Start again</button>
  </div>
  <div class="readout" id="out" aria-live="polite"></div>
  <p class="rule"><b>Rule:</b> each hop makes the note under ×1½ the new root, 7 keys up. The chain on the right puts each new root one twelfth of a turn further round, in the order the hops visit them. Piano tuning.</p>
</div>

<script>
(() => {
  const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
  const C3 = 130.8128;
  const theta = (j, r) => 360 * (2 ** ((((j - r) % 12) + 12) % 12 / 12) - 1);
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const a in attrs) e.setAttribute(a, attrs[a]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const cv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const COL = {}; ['text','muted','border','sticker','accent','good','dial','chain','code'].forEach(k => COL[k] = cv('--' + k));
  const polar = (cx, cy, R, d) => [cx + R * Math.sin(d * Math.PI / 180), cy - R * Math.cos(d * Math.PI / 180)];

  let hops = 0, override = null, busy = false;
  const root = () => (hops * 7) % 12;

  let ac;
  function pluck(f, when) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime + 0.02 + when, out = ac.createGain();
      out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(0.12, t + 0.01); out.gain.exponentialRampToValueAtTime(0.0005, t + 1.5);
      out.connect(ac.destination);
      for (let n = 1; n <= 8; n++) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f * n; g.gain.value = 1 / n; o.connect(g); g.connect(out); o.start(t); o.stop(t + 1.6); }
    } catch (e) {}
  }

  function size(svg) {
    const w = Math.max(220, Math.round(svg.getBoundingClientRect().width || 300));
    const R = Math.min(w / 2 - 34, 120), H = 2 * R + 62;
    svg.setAttribute('viewBox', `0 0 ${w} ${H}`); svg.setAttribute('height', H);
    return { w, R, cx: w / 2, cy: R + 30 };
  }

  function drawRing() {
    const svg = $('ring'); svg.replaceChildren();
    const { R, cx, cy } = size(svg);
    el('circle', { cx, cy, r: R, fill: 'none', stroke: COL.border, 'stroke-width': 2 }, svg);
    for (const [q, lab] of [[0, '×1'], [180, '×1½']]) {
      const [a1, b1] = polar(cx, cy, R - 8, q), [a2, b2] = polar(cx, cy, R + 8, q), [lx, ly] = polar(cx, cy, R - 24, q);
      el('line', { x1: a1, y1: b1, x2: a2, y2: b2, stroke: COL.dial, 'stroke-width': 2 }, svg);
      el('text', { x: lx, y: ly + 4, 'text-anchor': 'middle', 'font-size': 11.5, fill: COL.dial }, svg, lab);
    }
    const A = override || NAMES.map((_, j) => theta(j, root()));
    for (let j = 0; j < 12; j++) {
      const d = A[j], [x, y] = polar(cx, cy, R, d), [lx, ly] = polar(cx, cy, R + 18, d);
      const top = !override && j === root(), bot = !override && j === (root() + 7) % 12;
      el('circle', { cx: x, cy: y, r: top || bot ? 6.5 : 4.5, fill: j === 0 ? COL.sticker : top ? COL.accent : COL.text, stroke: bot ? COL.chain : '#0d1117', 'stroke-width': bot ? 3 : 1 }, svg);
      el('text', { x: lx, y: ly + 4, 'text-anchor': 'middle', 'font-size': 11.5, fill: top || bot ? COL.text : COL.muted, 'font-weight': top || bot ? 600 : 400 }, svg, NAMES[j]);
    }
  }

  function drawChain() {
    const svg = $('chain'); svg.replaceChildren();
    const { R, cx, cy } = size(svg);
    el('circle', { cx, cy, r: R, fill: 'none', stroke: COL.border, 'stroke-width': 1, 'stroke-dasharray': '2 5' }, svg);
    const pts = [];
    for (let k = 0; k <= Math.min(hops, 12); k++) pts.push(polar(cx, cy, R, 30 * k));
    if (pts.length > 1) el('polyline', { points: pts.map(p => p.join(',')).join(' '), fill: 'none', stroke: COL.chain, 'stroke-width': 2, 'stroke-opacity': 0.8 }, svg);
    for (let k = 0; k < 12; k++) {
      const [x, y] = polar(cx, cy, R, 30 * k), [lx, ly] = polar(cx, cy, R + 18, 30 * k);
      const visited = k <= hops, n = (k * 7) % 12;
      el('circle', { cx: x, cy: y, r: visited ? 5.5 : 2.5, fill: visited ? (n === 0 ? COL.sticker : COL.chain) : COL.border }, svg);
      if (visited) el('text', { x: lx, y: ly + 4, 'text-anchor': 'middle', 'font-size': 11.5, fill: COL.text }, svg, NAMES[n]);
    }
    if (hops >= 12) el('text', { x: cx, y: cy + 5, 'text-anchor': 'middle', 'font-size': 13, fill: COL.good, 'font-weight': 600 }, svg, 'home');
  }

  function update() {
    drawRing(); drawChain();
    const keys = hops * 7, oct = Math.floor(keys / 12), rest = keys % 12;
    let msg;
    if (hops === 0) msg = 'C is the root. Its opposite, under ×1½, is <b>G</b>. Press <b>Hop</b> to make G the root.';
    else if (hops < 12) msg = `Hop ${hops}: the root is now <b>${NAMES[root()]}</b>, and its opposite is <b>${NAMES[(root() + 7) % 12]}</b>. So far: ${keys} keys up, which is ${oct} octave${oct === 1 ? '' : 's'} and ${rest} key${rest === 1 ? '' : 's'}.`;
    else msg = `Twelve hops: every note visited once, and back to <b>C</b>. That is 84 keys up: exactly 7 octaves. On a piano, the chain of hops closes into a circle.`;
    $('out').innerHTML = msg;
    $('hop').disabled = busy || hops >= 12;
    try { parent.postMessage({ tuningEmbed: 'hops', height: Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height) + 2 }, '*'); } catch (e) {}
  }

  const ease = u => u < .5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2;
  function hop() {
    if (busy || hops >= 12) return;
    busy = true;
    const from = NAMES.map((_, j) => theta(j, root())), next = (root() + 7) % 12;
    const to = NAMES.map((_, j) => theta(j, next));
    pluck(C3 * 2 ** (root() / 12), 0); pluck(C3 * 2 ** ((root() + 7) / 12), 0.3);
    const t0 = performance.now();
    const f = t => {
      const u = Math.min(1, (t - t0) / 900), e = ease(u);
      override = from.map((a, j) => { const d = ((to[j] - a + 540) % 360) - 180; return a + d * e; });
      drawRing();
      if (u < 1) requestAnimationFrame(f);
      else { override = null; hops++; busy = false; update(); }
    };
    requestAnimationFrame(f);
    update();
  }

  $('hop').addEventListener('click', hop);
  $('reset').addEventListener('click', () => { if (busy) return; hops = 0; update(); });
  new ResizeObserver(() => update()).observe(document.querySelector('.wrap'));
  update();
})();
</script>
</body>
</html>
