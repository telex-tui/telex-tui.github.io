<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmonics on Both Rulers</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --code: #1c2128; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --sticker: #f2cc60; --band: #d29922; --harm: #3fb950;
  }
  html, body { margin: 0; background: transparent; color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; }
  .wrap { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { font-family: inherit; }
  .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin: 12px 0 8px; }
  .slider { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 220px; }
  .slider label { font-size: 13px; color: var(--muted); white-space: nowrap; }
  input[type=range] { flex: 1; accent-color: var(--harm); min-width: 120px; }
  .btn { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .btn.main { border-color: var(--sticker); }
  .readout { background: var(--code); border-radius: 6px; padding: 8px 10px; font-size: 13.5px; min-height: 3.1em; font-variant-numeric: tabular-nums; }
  .rule { font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 12px; }
  .rule b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <p class="lbl" id="strLbl"></p>
  <svg id="str" aria-label="A string vibrating in equal parts"></svg>
  <svg id="v" aria-label="Harmonics of C3, evenly spaced on the tuner's chart, joined by threads to where they land on the keyboard"></svg>
  <div class="controls">
    <div class="slider">
      <label for="count">Harmonics</label>
      <input id="count" type="range" min="1" max="16" value="8" aria-label="How many harmonics to show">
    </div>
    <button class="btn" id="one">&#9654; This harmonic alone</button>
    <button class="btn main" id="all">&#9654; The whole note</button>
  </div>
  <div class="readout" id="out" aria-live="polite"></div>
  <p class="rule"><b>Rule:</b> harmonic <i>n</i> of C3 vibrates exactly <i>n</i> times as fast as C3 (130.8 Hz). On the tuner's chart the harmonics are evenly spaced, 130.8 Hz apart. On the keyboard, each lands where its frequency belongs: one key per ×1.0595. Tap a harmonic to hear it.</p>
</div>

<script>
(() => {
  const C3 = 130.8128, MAXN = 16, KEYS = 48;                 // keyboard C3..C7
  const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
  const isBlack = i => [1, 3, 6, 8, 10].includes(((i % 12) + 12) % 12);
  const keyPos = n => 12 * Math.log2(n);                     // harmonic n, in keys above C3
  let N = 8, sel = 8;
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const a in attrs) e.setAttribute(a, attrs[a]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const cv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const COL = { text: cv('--text'), muted: cv('--muted'), border: cv('--border'), sticker: cv('--sticker'), harm: cv('--harm'), accent: cv('--accent') };

  function nearest(n) {
    const k = keyPos(n), r = Math.round(k), off = Math.round((k - r) * 100);
    return { name: NAMES[r % 12] + (3 + Math.floor(r / 12)), off };
  }

  // ---- Sound ----
  let ac;
  function ctx() { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; }
  function play(parts, dur) {
    try {
      const a = ctx(), t = a.currentTime + 0.02, out = a.createGain();
      out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(0.16, t + 0.03);
      out.gain.setValueAtTime(0.16, t + dur - 0.5); out.gain.linearRampToValueAtTime(0, t + dur);
      out.connect(a.destination);
      for (const [f, amp] of parts) {
        const o = a.createOscillator(), g = a.createGain();
        o.frequency.value = f; g.gain.value = amp; o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05);
      }
    } catch (e) {}
  }
  const playOne = n => play([[C3 * n, 0.9]], 1.6);
  const playAll = () => play(Array.from({ length: N }, (_, i) => [C3 * (i + 1), 0.55 / (i + 1)]), 2.2);

  // ---- The string, vibrating in `sel` equal parts ----
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let strPath = null, sw = 600;
  function drawString(w) {
    sw = w;
    const svg = $('str'); svg.replaceChildren();
    svg.setAttribute('viewBox', `0 0 ${w} 56`); svg.setAttribute('height', 56);
    el('line', { x1: 10, x2: w - 10, y1: 28, y2: 28, stroke: COL.border }, svg);
    for (const x of [10, w - 10]) el('rect', { x: x - 3, y: 14, width: 6, height: 28, fill: COL.muted }, svg);
    strPath = el('path', { fill: 'none', stroke: COL.harm, 'stroke-width': 2 }, svg);
    for (let k = 1; k < sel; k++) el('circle', { cx: 10 + (w - 20) * k / sel, cy: 28, r: 2.5, fill: COL.text }, svg);
    $('strLbl').textContent = sel === 1 ? 'The whole string vibrating: harmonic 1' : `The string vibrating in ${sel} equal parts: harmonic ${sel}`;
  }
  function frame(t) {
    if (strPath) {
      const amp = 14 * Math.cos(reduce ? 0 : t / 1000 * 2 * Math.PI * (0.6 + 0.12 * sel)) * Math.min(1, 3 / Math.sqrt(sel));
      let d = '';
      for (let i = 0; i <= 160; i++) {
        const u = i / 160, x = 10 + (sw - 20) * u, y = 28 - amp * Math.sin(Math.PI * sel * u);
        d += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
      }
      strPath.setAttribute('d', d);
    }
    if (!reduce) requestAnimationFrame(frame);
  }

  function draw() {
    const w = Math.max(280, Math.round(document.querySelector('.wrap').getBoundingClientRect().width - 30));
    drawString(w);
    if (reduce) frame(0);
    const svg = $('v'); svg.replaceChildren();
    const H = 236, yChart = 34, yKeys = 168, kh = 24;
    svg.setAttribute('viewBox', `0 0 ${w} ${H}`); svg.setAttribute('height', H);
    const fMax = C3 * MAXN;
    const cx = n => 10 + (w - 20) * (C3 * n) / fMax;             // tuner's chart, 0 Hz at the left
    const kx = p => 10 + (w - 20) * p / KEYS;                     // keyboard ruler, C3 at the left
    el('text', { x: 10, y: 12, 'font-size': 11, fill: COL.muted }, svg, "Tuner's chart: every hertz the same width");
    el('line', { x1: 10, x2: w - 10, y1: yChart, y2: yChart, stroke: COL.muted }, svg);
    el('text', { x: 10, y: yChart + 16, 'font-size': 10, fill: COL.muted }, svg, '0 Hz');
    el('text', { x: w - 10, y: yChart + 16, 'text-anchor': 'end', 'font-size': 10, fill: COL.muted }, svg, Math.round(fMax).toLocaleString('en') + ' Hz');
    // keyboard cells, one per key
    for (let i = 0; i <= KEYS; i++) {
      const x0 = i === 0 ? kx(0) : kx(i - 0.5), x1 = i === KEYS ? kx(KEYS) : kx(i + 0.5);
      el('rect', { x: x0, y: yKeys, width: Math.max(0.5, x1 - x0 - 0.4), height: kh, fill: isBlack(i) ? '#0d1117' : '#e9ecef', stroke: COL.border, 'stroke-width': 0.3 }, svg);
      if (i % 12 === 0) el('text', { x: kx(i), y: yKeys + kh + 14, 'text-anchor': i === 0 ? 'start' : i === KEYS ? 'end' : 'middle', 'font-size': 10.5, fill: COL.sticker }, svg, 'C' + (3 + i / 12));
    }
    el('text', { x: 10, y: yKeys - 8, 'font-size': 11, fill: COL.muted }, svg, '');
    // harmonics: evenly spaced on the chart, bunching up on the keyboard
    for (let n = 1; n <= N; n++) {
      const a = cx(n), b = kx(keyPos(n)), on = n === sel;
      const g = el('g', { style: 'cursor:pointer', role: 'button', 'aria-label': 'Harmonic ' + n }, svg);
      el('line', { x1: a, y1: yChart, x2: b, y2: yKeys, stroke: on ? COL.accent : COL.harm, 'stroke-width': on ? 2 : 1.1, 'stroke-opacity': on ? 1 : 0.7 }, g);
      el('line', { x1: a, y1: yChart - 6, x2: a, y2: yChart + 6, stroke: on ? COL.accent : COL.harm, 'stroke-width': 2 }, g);
      el('circle', { cx: b, cy: yKeys - 3, r: on ? 4 : 3, fill: on ? COL.accent : COL.harm }, g);
      el('rect', { x: a - 9, y: yChart - 26, width: 18, height: 30, fill: 'transparent' }, g);
      if (n <= 9 || n === sel || w > 560) el('text', { x: a, y: yChart - 10, 'text-anchor': 'middle', 'font-size': 10.5, fill: on ? COL.text : COL.muted, 'font-weight': on ? 600 : 400 }, g, n);
      g.addEventListener('click', () => { sel = n; playOne(n); update(); });
    }
  }

  function update() {
    if (sel > N) sel = N;
    draw();
    const { name, off } = nearest(sel);
    const f = C3 * sel;
    let msg = `<b>Harmonic ${sel}</b>: ${f.toFixed(1)} Hz, ${sel === 1 ? 'the note itself' : `×${sel} the note`}. It lands on <b>${name}</b>`;
    msg += off === 0 ? (sel === 1 ? '.' : ', dead on.') : `, ${Math.abs(off)} hundredths of a key ${off > 0 ? 'sharp' : 'flat'}.`;
    if (sel > 1) {
      const prev = C3 * (sel - 1);
      msg += ` On the chart it sits the same 130.8 Hz above the last one, but on the keyboard that gap is only ${(12 * Math.log2(sel / (sel - 1))).toFixed(1)} keys.`;
    }
    $('out').innerHTML = msg;
    try { parent.postMessage({ tuningEmbed: 'backwards', height: Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height) + 2 }, '*'); } catch (e) {}
  }

  $('count').addEventListener('input', e => { N = +e.target.value; sel = N; update(); });
  $('one').addEventListener('click', () => playOne(sel));
  $('all').addEventListener('click', playAll);
  new ResizeObserver(() => update()).observe(document.querySelector('.wrap'));
  update();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
