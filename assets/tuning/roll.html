<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roll It Up</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --code: #1c2128; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --sticker: #f2cc60; --band: #d29922; --note: #c9d1d9; --sel: #58a6ff;
  }
  html, body { margin: 0; background: transparent; color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; }
  .wrap { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  svg { display: block; width: 100%; overflow: visible; touch-action: manipulation; }
  svg text { font-family: inherit; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 10px 0 8px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button, .toggle { background: transparent; color: var(--muted); border: 0; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--code); color: var(--text); }
  .toggle { border: 1px solid var(--border); border-radius: 6px; }
  .toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--text); background: var(--code); }
  .toggle:disabled { opacity: .4; cursor: default; }
  .slider { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 200px; }
  .slider label { font-size: 13px; color: var(--muted); }
  input[type=range] { flex: 1; accent-color: var(--sticker); min-width: 120px; }
  .readout { background: var(--code); border-radius: 6px; padding: 8px 10px; font-size: 13.5px; min-height: 3.1em; font-variant-numeric: tabular-nums; }
  .rule { font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 12px; }
  .rule b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <svg id="v" aria-label="One octave of band, rolled into a ring. Tap a note to hear it."></svg>
  <div class="controls">
    <div class="seg" role="group" aria-label="Which band">
      <button id="bKey" aria-pressed="false">Keyboard band</button>
      <button id="bChart" aria-pressed="true">Chart band</button>
    </div>
    <div class="slider">
      <label for="roll">Roll</label>
      <input id="roll" type="range" min="0" max="1000" value="0" aria-label="How far the band is rolled up">
    </div>
    <button class="toggle" id="more" aria-pressed="false">Add the next octave</button>
  </div>
  <div class="readout" id="out" aria-live="polite"></div>
  <p class="rule" id="rule"></p>
</div>

<script>
(() => {
  // ---- Rules ----
  const C4 = 261.6256;
  const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B', 'C'];
  const ratio = j => 2 ** (j / 12);                       // key j above the bottom C, piano tuning
  // where a note sits along one octave of band, as a fraction of the octave's length
  const fracKey = j => j / 12;                             // carpenter: every key the same width
  const fracChart = j => ratio(j) - 1;                     // tuner: every hertz the same width
  const TICKS = [[1, '×1'], [1.25, '×1¼'], [1.5, '×1½'], [1.75, '×1¾']];

  let chart = true, s = 0, more = false, sel = 7;
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const a in attrs) e.setAttribute(a, attrs[a]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const cv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const COL = { text: cv('--text'), muted: cv('--muted'), border: cv('--border'), band: cv('--band'), sticker: cv('--sticker'), note: cv('--note'), sel: cv('--sel'), code: cv('--code') };

  // ---- Sound: a plucked tone with eight harmonics ----
  let ac;
  function pluck(f) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime, out = ac.createGain();
      out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(0.16, t + 0.01);
      out.gain.exponentialRampToValueAtTime(0.0005, t + 1.8);
      out.connect(ac.destination);
      for (let n = 1; n <= 8; n++) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = f * n; g.gain.value = 1 / n;
        o.connect(g); g.connect(out); o.start(t); o.stop(t + 1.9);
      }
    } catch (e) {}
  }

  // A point at fraction u along a band of length L that has been bent so that its
  // ends meet when s = 1. The band starts at (x0, y0) heading right and curls clockwise.
  function bent(u, L, x0, y0) {
    const k = s * 2 * Math.PI / L;
    if (k < 1e-6) return [x0 + u * L, y0, 0];
    const a = k * u * L, R = 1 / k;
    return [x0 + R * Math.sin(a), y0 + R * (1 - Math.cos(a)), a];
  }

  function draw() {
    const w = Math.max(280, Math.round($('v').getBoundingClientRect().width || 600));
    const svg = $('v'); svg.replaceChildren();
    const two = more && chart;
    const H = Math.round(Math.min(Math.max(w * (two ? 0.78 : 0.62), 300), two ? 470 : 380));
    svg.setAttribute('viewBox', `0 0 ${w} ${H}`); svg.setAttribute('height', H);
    const frac = chart ? fracChart : fracKey;
    const octs = two ? [0, 1] : [0];

    // World units: the first octave of band is 1 long. The second octave (chart band only) is
    // twice as long and starts where the first ends; rolled up, both rings share one centre.
    const start = o => o === 0 ? [0, 0] : [1 - s, -s / (2 * Math.PI)];
    const at = (o, u) => bent(u, 2 ** o, ...start(o));

    // Camera: frame the whole band, the same way at every stage of the roll.
    let x1 = Infinity, x2 = -Infinity, y1 = Infinity, y2 = -Infinity;
    for (const o of octs) for (let i = 0; i <= 80; i++) {
      const [x, y] = at(o, i / 80);
      x1 = Math.min(x1, x); x2 = Math.max(x2, x); y1 = Math.min(y1, y); y2 = Math.max(y2, y);
    }
    const padX = 34, padTop = 34, padBot = 40;
    const k = Math.min((w - 2 * padX) / Math.max(x2 - x1, 1e-6), (H - padTop - padBot) / Math.max(y2 - y1, 1e-6));
    const ox = (w - (x2 - x1) * k) / 2 - x1 * k;
    const oy = padTop + ((H - padTop - padBot) - (y2 - y1) * k) / 2 - y1 * k;
    const P = (o, u) => { const [x, y, a] = at(o, u); return [ox + x * k, oy + y * k, a]; };

    for (const o of octs) {
      const pts = [];
      for (let i = 0; i <= 160; i++) pts.push(P(o, i / 160));
      el('path', { d: 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L'), fill: 'none', stroke: COL.band, 'stroke-width': o ? 4 : 7, 'stroke-opacity': o ? 0.55 : 0.9, 'stroke-linecap': 'round' }, svg);
      if (o === 0) for (const [rv, lab] of TICKS) {       // ratio ticks on the first octave
        const [px, py, a] = P(0, chart ? rv - 1 : Math.log2(rv));
        const nx = -Math.sin(a), ny = Math.cos(a);          // normal pointing into the ring
        el('line', { x1: px + nx * 6, y1: py + ny * 6, x2: px + nx * 16, y2: py + ny * 16, stroke: COL.muted, 'stroke-width': 1.2 }, svg);
        el('text', { x: px + nx * 28, y: py + ny * 28 + 4, 'text-anchor': 'middle', 'font-size': 11, fill: COL.muted }, svg, lab);
      }
      for (let j = 0; j <= 12; j++) {
        if (o === 1 && j === 0) continue;
        if (j === 12 && s > 0.98 && o === 0) continue;      // the top C lands on the bottom C
        const [px, py, a] = P(o, frac(j));
        const nx = Math.sin(a), ny = -Math.cos(a);          // normal pointing outward
        const isC = j % 12 === 0, isSel = j === sel && o === 0;
        const g = el('g', { style: 'cursor:pointer', role: 'button', 'aria-label': 'Play ' + NAMES[j] }, svg);
        el('circle', { cx: px, cy: py, r: 14, fill: 'transparent' }, g);
        el('circle', { cx: px, cy: py, r: isC ? 6.5 : 5, fill: isC ? COL.sticker : isSel ? COL.sel : COL.note, stroke: isSel ? COL.sel : '#0d1117', 'stroke-width': isSel ? 2.5 : 1 }, g);
        el('text', { x: px + nx * 17, y: py + ny * 17 + 4, 'text-anchor': 'middle', 'font-size': 11.5, fill: isSel ? COL.text : COL.muted, 'font-weight': isSel ? 600 : 400 }, g, NAMES[j] + (o ? '\u2032' : ''));
        g.addEventListener('click', () => { sel = j; pluck(C4 * 2 ** o * ratio(j)); update(); });
      }
    }
  }

  function update() {
    draw();
    const r = ratio(sel);
    const angChart = 360 * (r - 1), angKey = 30 * sel;
    const turns = a => (a / 360).toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
    $('out').innerHTML = sel === 0
      ? '<b>C</b> is where both bands start, at the top. Tap any other note to hear it and see where it lands.'
      : `<b>${NAMES[sel]}</b> vibrates <b>×${r.toFixed(3)}</b> as fast as C. ` +
        (chart
          ? `On the chart band it sits <b>${angChart.toFixed(1)}°</b> round (${turns(angChart)} of a turn). On the keyboard band it would sit ${angKey}°.` +
            (sel === 7 ? ' ×1½ is exactly half a turn here, and G lands just short of it.' : sel === 4 ? ' ×1¼ is exactly a quarter turn here, and E lands just past it.' : '')
          : `On the keyboard band it sits <b>${angKey}°</b> round (${sel}/12 of a turn), one twelfth further than the key below. On the chart band it would sit ${angChart.toFixed(1)}°.`);
    $('rule').innerHTML = chart
      ? '<b>Chart band:</b> one octave of the tuner’s chart, where every hertz is the same width. Rolled up, a note’s angle is its frequency’s share of the way from C to the next C: ×1½ is half a turn.' + (more ? ' <b>Next octave:</b> twice as long on the chart, so it rolls into a ring twice the size.' : '')
      : '<b>Keyboard band:</b> one octave of the carpenter’s keys, every key the same width. Rolled up, every key gets 1/12 of a turn.';
    $('more').disabled = !chart;
    $('bKey').setAttribute('aria-pressed', String(!chart));
    $('bChart').setAttribute('aria-pressed', String(chart));
    $('more').setAttribute('aria-pressed', String(more && chart));
    try { parent.postMessage({ tuningEmbed: 'roll', height: Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height) + 2 }, '*'); } catch (e) {}
  }

  $('bKey').addEventListener('click', () => { chart = false; update(); });
  $('bChart').addEventListener('click', () => { chart = true; update(); });
  $('more').addEventListener('click', () => { more = !more; update(); });
  $('roll').addEventListener('input', e => { s = e.target.value / 1000; update(); });
  new ResizeObserver(() => update()).observe(document.querySelector('.wrap'));
  update();
})();
</script>
</body>
</html>
